# goreleaser — desktop binaries, Linux packages, the Homebrew tap, and the signed checksums file.
#
# SCOPE. goreleaser owns the "download a binary" and "apt/dnf install" distribution channels. It does
# NOT build or push container images: those are cross-compiled and joined with `docker buildx
# imagetools` in .github/workflows/release.yml, which is emulation-free (see that file's header). A
# `dockers:` block here would reintroduce QEMU or duplicate the image build, so there is none, and a
# gate asserts the string `qemu` appears in no workflow file.
#
# `dkp.exe` is a first-class channel — Windows is in the matrix below and the OS matrix is exercised
# nightly — because modernc.org/sqlite file locking and t.TempDir() cleanup differ there.
#
# This is goreleaser v2 config (schema version 2); the action is pinned to goreleaser-action v7 in
# release.yml.
version: 2

project_name: dkp

before:
  hooks:
    # The runtime third-party notices, regenerated from the module graph and attached to every
    # release below. Kept as a make target so the same command runs locally, in this hook, and in
    # any future job. See Makefile `third-party-notices` and THIRD_PARTY_NOTICES.txt.
    - make third-party-notices

builds:
  - id: dkp
    main: ./cmd/dkp
    binary: dkp
    # Pure Go all the way down (modernc.org/sqlite), so CGO stays off and every target
    # cross-compiles at native speed on the amd64 release runner.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The same stamps the Makefile and the Dockerfile inject, so a goreleaser binary reports the
    # identical version/commit/date. goreleaser supplies the values from the tag and the commit.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible: no wall-clock in the binary
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: dkp
    ids:
      - dkp
    # zip on Windows (no tar there by default), tar.gz elsewhere. Templated name so the asset says
    # what platform it is without opening it.
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      # The paperwork every archive must carry. THIRD_PARTY_NOTICES.txt is generated by the before
      # hook above; the others are tracked files.
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.txt
      - README.md

# Linux packages. apk is included because the -debug image variant is alpine-based and some
# operators run the binary directly on Alpine hosts.
nfpms:
  - id: dkp
    ids:
      - dkp
    package_name: dkp
    vendor: The Dragon Kill Party contributors
    homepage: https://github.com/prokopto-dev/dragonkillparty
    maintainer: The Dragon Kill Party contributors <noreply@dragonkillparty.org>
    description: DKP and guild management for Project 1999 EverQuest raiding guilds.
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    contents:
      # Ship the systemd unit so `apt install ./dkp.deb` gives an operator a service to enable.
      - src: deploy/systemd/dkp.service
        dst: /lib/systemd/system/dkp.service
        type: config
      - src: LICENSE
        dst: /usr/share/doc/dkp/LICENSE
      - src: THIRD_PARTY_NOTICES.txt
        dst: /usr/share/doc/dkp/THIRD_PARTY_NOTICES.txt

# A single checksums file over every artifact, then a cosign keyless signature over that file. The
# certificate identity is this workflow at the tag ref — the README's verify snippet must match it.
checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    output: true

# A syft SBOM per archive, attached to the release.
sboms:
  - id: archive
    artifacts: archive

# The Homebrew formula. goreleaser writes it into the dedicated tap repo with HOMEBREW_TAP_TOKEN;
# humans never touch that repo (Homebrew mandates a separate repository for a tap).
brews:
  - name: dkp
    ids:
      - dkp
    repository:
      owner: dragonkillparty
      name: homebrew-dkp
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/prokopto-dev/dragonkillparty
    description: DKP and guild management for Project 1999 EverQuest raiding guilds.
    license: Apache-2.0
    # A formula install is a binary drop; the service is the operator's to wire up.
    install: |
      bin.install "dkp"
    test: |
      system "#{bin}/dkp", "version"

# The GitHub Release is created as a DRAFT. release.yml's `publish` job un-drafts it only after the
# smoke gate passes, so a build that failed to boot never becomes a visible download.
release:
  draft: true
  prerelease: auto
  mode: keep-existing
