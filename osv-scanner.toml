reason = "Issue #134. esbuild 0.27.7 arbitrary file read from the DEVELOPMENT server on Windows, CVSS 2.5 LOW, fixed in 0.28.1. Transitive devDependency of vite@7.3.5; the exposed case is a Windows contributor running `make dev`, and the production build starts no dev server. Not fixed here because a Vite bump moves the build output and has to re-clear budget/bundle, test/e2e and verify-spa-dist on its own merits."

