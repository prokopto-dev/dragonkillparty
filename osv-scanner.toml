# osv-scanner configuration — the reviewable waiver file for `security / osv` (issue #132).
#
# `make osv-scan` and CI's `security / osv` job pass `--config=osv-scanner.toml` explicitly rather
# than relying on discovery. osv-scanner looks for a config beside each scanned lockfile, which for
# web/pnpm-lock.yaml would mean a second copy of this file in web/ — and two waiver files is how one
# of them stops being read by anybody.
#
# WHAT AN ENTRY HERE COSTS. `security / osv` is a REQUIRED, blocking job: it is in ci-required's
# needs list and in its always-on assertion, and it is not `continue-on-error`. Every id here is
# therefore a hole in a gate, deliberately cut, and the three rules that keep it from becoming the
# gate's off switch are enforced by TestOSVConfig_EveryIgnore_HasReasonIssueAndExpiry in test/repo:
#
#   1. `reason` names a filed GitHub issue. A waiver nobody tracks is a decision nobody revisits.
#      This is the same rule web/e2e/axe-allowlist.json lives under.
#   2. `ignoreUntil` is set, and is in the future. The waiver EXPIRES: after that date the job goes
#      red again on every PR whether or not anybody remembered. An open-ended ignore is a deletion
#      with extra steps.
#   3. `reason` says why it is not fixed in the PR that added the waiver — not merely what it is.
#
# HOW TO CLEAR ONE. Fix the dependency, run `make osv-scan`, delete the block, close the issue. Do
# not extend `ignoreUntil` to buy time without saying so in the issue; the date is the forcing
# function and moving it silently is the same as removing it.
#
# WHAT DOES NOT BELONG HERE. A vulnerability in a RUNTIME dependency of the shipped binary or the
# shipped SPA bundle. A waiver is for a build- or lint-time tool that never reaches a guild's
# server; a runtime finding is an incident, not a waiver.

# ---------------------------------------------------------------------------------------------
# THERE ARE CURRENTLY NO WAIVERS, and that is the intended steady state: every finding has been
# fixed rather than ignored.
#
# The first scan of web/pnpm-lock.yaml this repository ever ran — the npm blind spot #132 exists to
# close — reported three, all transitive devDependencies (#133 @eslint/plugin-kit ReDoS,
# #134 esbuild dev-server file read, #135 js-yaml quadratic CPU). All three were cleared in the
# dependency bump that closed them, before their 2026-11-09 expiry, so their blocks are gone from
# here and their ids are gone from test/golden/supply-chain/osv-waivers.txt. The Go graph
# (go.mod, 28 packages) came back clean, which is the expected result given govulncheck has been
# running over it as a required job since Phase 0 PR 12.
#
# ADDING ONE is a two-file edit by design: the block goes here, and the bare id goes in
# test/golden/supply-chain/osv-waivers.txt, which is CODEOWNERS-protected.
# TestOSVConfig_WaiverSet_MatchesTheOwnedGoldenFile fails when the two disagree, so cutting a hole
# in a required supply-chain gate cannot happen without a code owner agreeing the reason is good.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# GO-2026-5932 — `golang.org/x/crypto/openpgp` is unmaintained and unsafe by design.
#
# THIS IS THE EDGE THE "NOT FOR RUNTIME DEPENDENCIES" RULE ABOVE DOES NOT COVER, and it is written
# out here rather than left to the reason string alone. x/crypto IS a runtime dependency of the
# shipped binary — argon2id password storage, locked by 03-security.md §3.1, which the standard
# library does not provide. The package the advisory is ABOUT is in no build of anything here:
#
#     $ go list -deps ./... | grep 'x/crypto'
#     golang.org/x/crypto/blake2b     # argon2's own dependency
#     golang.org/x/crypto/argon2
#     $ go list -deps ./cmd/dkp/... | grep -c openpgp
#     0
#
# The advisory carries `introduced: 0` and NO fixed version, because openpgp is permanently
# deprecated rather than patchable — so there is no upgrade that clears this and no "fix it in the
# PR that added the waiver" available. `security / govulncheck`, the required job that DOES do
# reachability analysis, reports nothing; the disagreement is granularity, not a difference of
# opinion about the risk.
#
# THE EXPIRY IS NOT A FIX WINDOW. There is no fix to wait for. What one year forces is a re-read of
# the DECISION — including the call-analysis alternative recorded on #280 — rather than of the fact
# below it, because that fact is now checked on every `make test` rather than annually by hand:
# TestOSVWaiver_OpenPGP_IsInNoBuildGraph (test/repo/osv_scanner_test.go) runs the listing above and
# fails the moment an openpgp package enters this module's build graph, test files included.
#
# It has to be a test, because the scanner cannot notice. osv-scanner matches at MODULE granularity,
# so it goes on filtering this advisory — printing the reason below back verbatim as it does — for
# exactly as long as the entry exists, whether or not the reason is still true. Verified by import
# and re-scan, not assumed. So: do not extend the date without re-reading the decision, and do not
# delete that test without deleting the waiver and its golden id in the same change.
# ---------------------------------------------------------------------------------------------
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained; this repository imports only argon2 and blake2b and no openpgp package appears in any build graph, so the advisory is unreachable. There is no fixed version - the package is permanently deprecated. Tracked in #280; the expiry forces a re-check that we still do not import it."
ignoreUntil = 2027-08-20
