# SKELETON. Every step shells out to a `make` target; most of those targets are `notyet` stubs.
# The schedule, the fork guard, the job graph and the issue-filing behaviour are real and final.
#
# Filled in by: Phase 0 PR 1 (the workflow itself + link checking), Phase 1 (River soak),
# Phase 5 (importer matrix), Phase 8 (upgrade ladder, Postgres convergence). See ROADMAP.md and
# docs/design/06-cicd-and-release.md sections 3 and 8.
#
# WHAT THIS FILE IS FOR
# ---------------------
# ci.yml answers "is this diff correct?" in under six minutes. This file answers "is the product
# still true?" and is allowed to take an hour. A check belongs here, and not in ci.yml, when its
# failure is NOT deterministic given a PR's diff, or NOT actionable by that PR's author:
#   - external links break on the world's schedule
#   - a new CVE in ca-certificates appears on the world's schedule
#   - the upgrade ladder depends on every PUBLISHED release, not on this diff
#   - a 10k-job soak takes longer than the entire PR budget
# Blocking a P99 parser fix on any of those is how you lose contributors.
#
# Failures file an issue rather than emailing a maintainer, because an issue is triageable by
# whoever has time on Saturday and an email is not.
#
# ACTION PINS — see the note at the top of ci.yml. PIN001 in `lint / repo` asserts the SHAPE of every
# pin below, not that a digest is the commit its trailing comment claims. Treat them as unverified.

name: nightly-verify

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC. Off the hour on purpose — the top of the hour is congested.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-verify
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  IMAGE: ghcr.io/${{ github.repository_owner }}/dragonkillparty
  REFDB: ghcr.io/${{ github.repository_owner }}/dkp-refdb
  FIXTURES: ghcr.io/${{ github.repository_owner }}/dkp-fixtures

jobs:
  # ---------------------------------------------------------------------------------------------
  # Fork guard. Without this, every fork of this repository runs the full nightly suite forever,
  # which is rude and becomes a support burden the first time a forker's Actions bill surprises
  # them. Every scheduled job in this file needs it.
  # ---------------------------------------------------------------------------------------------
  guard:
    name: guard
    if: github.repository_owner == 'prokopto-dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "running nightly for ${{ github.repository }}"

  # ---------------------------------------------------------------------------------------------
  # importer — the full EQdkp Plus matrix, and since issue #159 the ONLY place the importer suite
  # runs. ci.yml had a `test / importer` job gated on `importer && deep`: ten minutes of MariaDB
  # containers on a PR, for ONE fixture. This runs all six every night, because importer fidelity is
  # risk R1 and a guild that loses faith on day one does not come back — and because a failure here
  # files an issue instead of blocking a parser fix, which is this file's own rule for what belongs
  # in it: not deterministic given a PR's diff, and expensive.
  # ---------------------------------------------------------------------------------------------
  importer:
    name: importer / ${{ matrix.fixture }}
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - eqdkp-2.0.5
          - eqdkp-2.1.5
          - eqdkp-2.2.27
          - eqdkp-2.3.39
          - hostile # mojibake, PHP-serialised blobs, orphan FKs, duplicate names, NULL dates
          - real-anonymised # one donated guild dump, anonymised, CODEOWNERS-protected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # `make test-importer` is a Go test binary driving testcontainers once Phase 5 fills the
          # stub, and every input of this action defaults to "false" — so with no `with:` block the
          # job installed nothing and ran on whatever Go the runner image shipped (issue #164, the
          # #156 defect class). The job this closes it for is the one issue #159 moved here from
          # ci.yml; the defect moved with it and is fixed in its new home.
          go: "true"
      - env:
          FIXTURE: ${{ matrix.fixture }}
        run: make test-importer
        # Pulls ghcr.io/prokopto-dev/dkp-fixtures:${FIXTURE} (a public OCI artifact built by
        # fixtures.yml), restores it into MariaDB via testcontainers, runs the two-phase ETL, and
        # asserts the classifier oracle: every delta between the EQdkp-computed balance and the
        # DKP-computed balance is EXPLAINED by a named rule. Any `unexplained` classification fails
        # the build.
        # The importer default is --dry-run; this suite never passes --commit.

  # ---------------------------------------------------------------------------------------------
  # property-deep — the same properties PR CI runs, at a hundred times the case count.
  #
  # 200 checks per PR keeps the inner loop under ten seconds and finds the counterexamples that are
  # dense in the input space. 20,000 finds the ones that are not: a largest-remainder split where
  # every quota ties, an int64 sum that wraps only for a price above 2^60, a reversal whose
  # provenance pointers matter only when four of them are set at once. Those are exactly the shapes
  # nobody writes a table test for, and exactly the shapes that reallocate points silently.
  #
  # It belongs here rather than in ci.yml by this file's own rule: the failure is not deterministic
  # given a PR's diff. A 20,000-case run explores inputs the PR author never chose, so blocking their
  # merge on it would be blocking them on somebody else's arithmetic.
  #
  # The seed is FIXED (DKP_PROPERTY_SEED defaults in the test), so a nightly counterexample replays
  # exactly: the printed seed plus DKP_PROPERTY_CHECKS=1 reproduces the single failing case.
  # ---------------------------------------------------------------------------------------------
  property-deep:
    name: property / 20k
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
      - env:
          DKP_PROPERTY_CHECKS: "20000"
        run: make test-property
        # One env var and no second code path. A nightly suite that COMPILED differently from the
        # per-PR suite is a nightly suite that can go green while the real one is broken, so the
        # count is read at runtime and a malformed value fails the tests rather than falling back to
        # 200 — a typo'd 2O000 that quietly ran the PR count would report a deep run that never
        # happened.

  # ---------------------------------------------------------------------------------------------
  # perf / 520k — the V5 standings spike at full guild scale (issue #190).
  #
  # `make test` runs the same suite on every PR at eight raids, which proves the code path still
  # works; this runs it at 3,400, which is the only size the question is actually about. It seeds
  # 527,164 entries through the real ledger commit path, replays every one of them against
  # balance_snapshot, and holds the standings read to 4 statements and a 150 ms p99 on
  # SD-card-class storage.
  #
  # It belongs here rather than in ci.yml for this file's own reason and one more. The reason: three
  # minutes and a few hundred megabytes of scratch disk is not a per-PR cost anybody should pay for
  # a number that changes when the SCHEMA changes, not when a PR does. The extra one: `make
  # test-perf` deliberately runs without `-race`, because the detector instruments
  # modernc.org/sqlite — the SQLite engine compiled to Go — and a latency measured under it is a
  # measurement of the detector. The per-PR run knows that and asserts only the page-count half.
  #
  # DKP_PERF_RAIDS is the same one-knob shape as DKP_PROPERTY_CHECKS above: read at runtime, no
  # second code path, and a malformed value fails the tests rather than silently running the small
  # profile while reporting a deep one.
  # ---------------------------------------------------------------------------------------------
  perf-standings:
    name: perf / 520k
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
      - env:
          DKP_PERF_RAIDS: "3400"
        run: make test-perf

  # ---------------------------------------------------------------------------------------------
  # replay / seed.Perf — `dkp verify-ledger` over a guild-scale ledger (issue #198, ROADMAP Phase 1
  # item 9).
  #
  # It seeds 527,164 entries through ledger.Service.Commit and then replays every one of them:
  # recomputes each batch hash and each audit hash from the stored rows, walks both prev_hash chains
  # to the heads in dkp_meta, and folds the whole log back into per-account balances that must
  # reproduce balance_snapshot exactly — amount, entry count and as-of seq, with no cached row the
  # log does not support and no account the cache has missed.
  #
  # THIS JOB IS A CORRECTNESS DEPENDENCY, not a verification nicety, and ADR-0023 is what makes it
  # one. The cache is LOAD-BEARING: serving standings from the log is 10,412 pages against the
  # cache's 13, so there is no fallback that answers more slowly and a drifted cache is a wrong page
  # rather than a degraded one. That ADR names the failure mode in its own consequences — "if the
  # nightly replay silently stops running, a drifted cache becomes undetectable — the failure mode
  # this project criticises EQdkp Plus for" — and raises a standard for this job: it must fail
  # loudly and visibly. It does: `dkp verify-ledger` exits non-zero on a finding AND on a read it
  # could not make, and `nightly-report` below carries it into the single nightly issue.
  #
  # Until this existed, the cache-versus-fold claim rested on a unit test whose snapshot rows the
  # test itself had written, which is circular. Here the rows were written by the commit path while
  # it was busy committing 20,461 transactions, and the replay is the product's own verifier rather
  # than a fold written for the occasion.
  #
  # HERE AND NOT IN ci.yml, by this file's own rule, and it is a close call worth stating. The
  # per-PR half DOES run: internal/ledger's perf suite seeds eight raids and runs the same
  # ledger.Verify over them on every push, so the code path cannot rot unnoticed. What it cannot do
  # per PR is the SCALE — ninety seconds of seeding and a few hundred megabytes of scratch disk for
  # a property that changes when the SCHEMA or the commit path changes, not when a typical diff
  # does. That is the same trade `perf / 520k` above makes with the same profile.
  #
  # A failure here is a bug in this software, never data loss, and the nightly issue should say so:
  # the log is intact and the cache is derived from it. The repair is `dkp verify-ledger --rebuild`,
  # which is not implemented yet (issue filed) — and which this job would not run in any case,
  # because a verifier that could write is a verifier that can hide what it found.
  replay-ledger:
    name: replay / seed.Perf
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # `make verify-ledger` compiles cmd/dkp and runs the binary — no SPA, no other toolchain.
          go: "true"
      - run: make verify-ledger
        # Build, migrate, seed the full Perf profile into a scratch directory, replay it, remove the
        # directory. RAIDS is unset, so this is the 3,400-raid profile — the size every budget in
        # the roadmap is stated at. `dkp verify-ledger` exits non-zero on any finding AND on any
        # read it could not make, so a green step here is a replay that happened and was clean,
        # rather than one that quietly found nothing to read.

  # ---------------------------------------------------------------------------------------------
  # suite / shuffled — the whole Go suite with `-shuffle=on -count=1`, which the per-PR run no
  # longer carries (issue #155).
  #
  # THIS JOB IS THE OTHER HALF OF A DECISION, not a nightly nice-to-have. `go test`'s result cache
  # is what makes an unchanged package report `(cached)` instead of re-running, and both flags
  # defeat it: `-count=1` by definition, and `-shuffle=on` because its seed is the wall clock and
  # `-test.shuffle` is not in the cacheable flag set. So the PR path gave them up for the packages
  # that can be cached safely, and what shuffle actually buys had to keep happening somewhere.
  #
  # It buys order-dependence found OVER TIME. A fixed seed shuffles once and forever; a re-rolled
  # one explores a different order every run, which is why internal/*/kinds, internal/authz's
  # catalogue, internal/api's error and permission tables and internal/clock all cite it by name as
  # the reason they return copies rather than package-level slices. A nightly re-roll keeps finding
  # that class of bug; it finds it a day later than a per-PR re-roll would, against a smaller diff
  # than a week of merges, and it does not make every PR pay for the search.
  #
  # ONE ENV VAR AND NO SECOND CODE PATH — the shape property-deep above already uses for
  # DKP_PROPERTY_CHECKS, and for the same reason: a nightly suite that COMPILED differently from the
  # per-PR one is a nightly suite that can go green while the real one is broken. DKP_TEST_SHUFFLE
  # is read by the Makefile's TEST_CACHE_FLAGS and puts `-shuffle=$(value) -count=1` back on the
  # cacheable lane. A malformed value fails in `go test` rather than falling back to no shuffle.
  #
  # Both suites, because they select different tests: `make test-unit` is -short, `make test` is
  # -race and runs the integration and gate suites the -short run skips.
  # ---------------------------------------------------------------------------------------------
  shuffled-suite:
    name: suite / shuffled
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DKP_TEST_SHUFFLE: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          # The same tools `test / integration` installs, and for the same reasons: internal/core's
          # TestLintBan_* meta-tests exec golangci-lint, test/repo's githooks_test needs gofumpt to
          # exercise the hooks, its atlas_lock and new_migration suites need atlas,
          # python_floor_test re-parses scripts/*.py at the declared floor, and the lint-actions and
          # lint-shell fixtures drive actionlint, shellcheck and shfmt against tainted trees in
          # t.TempDir(). Without them those suites skip, and a shuffled run that skipped the
          # shell-out gates would be a shuffled run of the half that was never at issue.
          #
          # KEEP THIS LIST EQUAL TO ci.yml's `test / integration`. Since issue #177 a tool-gated
          # skip in test/repo FAILS when CI is set rather than skipping, so a tool missing here is
          # a red nightly rather than a quiet hole — which is the point, and also the reason the
          # two lists must not drift.
          tools: "golangci-lint gofumpt atlas actionlint shellcheck shfmt"
          python: "true"
          # Node, for the pnpm-gated suites this job was skipping exactly as `test / integration`
          # was (issue #177) — the two shared the omission when #159 gave this job that job's
          # toolchain.
          node: "true"
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: make test-unit
      - run: make test

  # ---------------------------------------------------------------------------------------------
  # postgres — convergence only, not a supported engine in 1.0. Ninety nightly seconds that keep
  # the post-1.0 door open at zero PR-time cost.
  # ---------------------------------------------------------------------------------------------
  postgres-convergence:
    name: postgres / schema-convergence
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # The digest is the multi-arch OCI index for postgres:17-alpine (PostgreSQL 17.11), not a
        # per-platform manifest: the runner pulls whatever architecture it is. It shipped as an
        # all-zeros PLACEHOLDER and stayed one, so `docker pull` failed before a step ever ran and
        # this job was red every night for months without once reaching the check it names (#246).
        # test/repo/container_pins_test.go now fails a placeholder digest, because a pin nobody can
        # resolve is indistinguishable in a diff from a pin that works.
        image: postgres:17-alpine@sha256:d4bb0a8c1b7bb2e29f976d099e7bfb9a5d8858cffe9e46b35cd302cd1f1f8168 # pinned by Renovate docker:pinDigests
        env:
          POSTGRES_PASSWORD: dkp
          POSTGRES_DB: dkp_convergence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - env:
          PGURL: postgres://postgres:dkp@localhost:5432/dkp_convergence?sslmode=disable
        run: make verify-postgres
        # WHAT THIS RUNS TODAY: nothing. `verify-postgres` is a `notyet` stub that prints
        # "lands in: post-1.0" and exits 0 — internal/store/pggen and db/migrations-postgres do not
        # exist yet (ROADMAP 1.3). So the service above is provisioned for a no-op, and fixing the
        # digest makes this job green without making it a check. Issue #249 tracks the choice
        # between implementing it and standing the service down until then; it is recorded here
        # rather than left as a green tick that reads like a passing convergence gate.
        #
        # What it will do:
        # 1. build with the CI-only `postgres` tag and assert the compile-time interface assertion
        #    `var _ Queries = (*pggen.Queries)(nil)` still holds
        # 2. apply db/migrations-postgres/ to an empty database
        # 3. `atlas schema inspect` on BOTH dialects, normalise, and assert the two logical
        #    fingerprints are identical
        # Failing here means a SQLite-only construct entered the schema. That is fine to do
        # deliberately and not fine to do accidentally — this job is the difference.

  # ---------------------------------------------------------------------------------------------
  # image / arm64-cross — the ONLY thing in this repository that builds linux/arm64 before the
  # release train does (issue #108).
  #
  # `mq / image-arm64` used to claim this and never ran: it was gated on `merge_group` and there is
  # no merge queue, so #101 deleted it rather than pretend. That left arm64 built in exactly one
  # place — release.yml's per-arch matrix — where a GOARCH-conditional build tag, a Dockerfile or
  # base-image assumption, or a cgo dependency arriving through a bump is discovered while cutting a
  # release. That is the worst moment to find it: the image job is fail-fast, so a broken arm64 stops
  # the release after the tag exists and before the manifest is joined.
  #
  # NO QEMU, here or anywhere (release.yml's header, QEMU001 in scripts/repo-gates.sh). Go
  # cross-compiles and modernc.org/sqlite is pure Go, so this is a normal amd64 runner emitting an
  # arm64 image at native speed. Nothing in this job RUNS the arm64 binary — running it is what would
  # need emulation, and validating it does not.
  #
  # Nightly rather than per-PR is the honest tier by this file's own rule: an arm64-only break is not
  # deterministic given a typical diff, and it costs a whole image build. The release matrix remains
  # the thing that ships arm64; this is the thing that finds out first.
  # ---------------------------------------------------------------------------------------------
  image-arm64:
    name: image / arm64-cross
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - run: make verify-image-arm64
        # PLATFORM=linux/arm64 make docker, then scripts/verify-image-arch.sh: the image config must
        # say arm64 AND the binary inside it must be an AArch64 ELF. The second half is the one that
        # matters here — buildx labels the image from --platform, so an image whose Dockerfile stopped
        # threading GOARCH through would be a correctly-labelled arm64 image containing an amd64
        # binary, and no CI job boots it (that would need the QEMU this project bans).

  # ---------------------------------------------------------------------------------------------
  # soak — River is an early-preview job driver (risk R6). A 10k-job soak is the only cheap way to
  # find a stuck queue, a lost periodic run, or a leaked connection before a guild does.
  # ---------------------------------------------------------------------------------------------
  river-soak:
    name: soak / river-10k
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - env:
          JOBS: "10000"
        run: make soak-jobs
        # Enqueue 10k jobs across every registered kind against a real SQLite file, with the worker
        # pool at production settings. Asserts: every job reaches a terminal state, zero dead
        # letters, no job runs twice (idempotency keys hold under concurrency), periodic jobs fire
        # exactly once per period, `dkp_outbox_lag_seconds` returns under 30 s, goroutine count is
        # flat at the end, and the WAL does not grow without bound.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: river-soak-report
          path: test/soak/report/

  # ---------------------------------------------------------------------------------------------
  # upgrade ladder — this is what converts "any 1.x upgrades directly to any later 1.y" from a
  # promise into a verified property. About ten two-minute jobs.
  # ---------------------------------------------------------------------------------------------
  upgrade-ladder-enumerate:
    name: upgrade-ladder / enumerate
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.e.outputs.versions }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: e
        env:
          GH_TOKEN: ${{ github.token }}
        run: make upgrade-ladder-enumerate
        # Enumerates GitHub RELEASES — every published minor from the oldest supported version to
        # the latest — and FAILS if any of them lacks a $REFDB artifact. Iterating "whatever refdbs
        # happen to exist" is how the ladder rots silently: a release that fails after the image
        # step but before `refdb` leaves a hole nobody notices until an upgrade breaks.
        #
        # The target writes `versions=<json array>` to $GITHUB_OUTPUT — that is what `outputs:`
        # above publishes and what the matrix below expands. Printing the array to stdout ALONE
        # left `versions` unset and expanded `fromJSON('')`, which fails the whole run outside the
        # job graph (issue #255): eighteen green jobs, no red check-run, and no `upgrade-ladder`
        # entry to click. It always emits valid JSON, `[]` included.

  # NOTHING TO LADDER IS A PASS (issue #255). Before the first release there is no version to
  # upgrade FROM, so `enumerate` emits `[]` and this job skips. Without the guard the run dies at
  # matrix expansion — `[]` is "Matrix vector 'version' does not contain any values", and the empty
  # string that predated the $GITHUB_OUTPUT write was a JSON parse error — and BOTH surface as a
  # run-level failure with no job entry at all. A red nightly nobody can open is worse than no
  # nightly: it trains maintainers to ignore the badge, which is what four consecutive nights of it
  # did. The condition is deliberately not `!= '[]'` alone; an unset output must skip too, so that a
  # future enumerate that dies before writing its output cannot be read as "ladder ran".
  upgrade-ladder:
    name: upgrade-ladder / ${{ matrix.version }}
    needs: upgrade-ladder-enumerate
    if: needs.upgrade-ladder-enumerate.outputs.versions != '' && needs.upgrade-ladder-enumerate.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        version: ${{ fromJSON(needs.upgrade-ladder-enumerate.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - env:
          FROM_VERSION: ${{ matrix.version }}
        run: make test-upgrade-ladder
        # Pull $REFDB:$FROM_VERSION, run HEAD against it, and assert:
        #   the pre-migration snapshot was written before anything else happened
        #   every migration applies, with PRAGMA integrity_check after each one
        #   protected-table row counts and column digests did not DECREASE
        #     (ledger_batch, ledger_entry, raid, tick, attendance, award, adjustment, person,
        #      character, item) — SQLite's 12-step table rebuild is exactly where a mistyped
        #      column list silently drops a column's data
        #   the append-only triggers still fire AFTER the full migration set
        #   `dkp verify-ledger` is clean and every balance equals the SUM over its batches
        #   /readyz returns 200
        # Migrations are forward-only: there is no down path to test, and there never will be.

  # ---------------------------------------------------------------------------------------------
  # example-endpoint-eval — DELIBERATELY NOT WIRED HERE YET (decision record §U5).
  #
  # The agent-eval that hands a fresh session the two worked-example documents and one instruction
  # (add GET /api/v1/guild/settings) ships in Phase 0 PR 5b as a LOCAL-ONLY target,
  # `make eval-example-endpoint` (scripts/eval-example-endpoint.sh). It is not a nightly job because
  # it needs an agent runner and an API key, and which runner, whose key and what budget are
  # unsettled — a workflow that referenced a secret nobody has agreed to would be the overreach U5
  # forbids. The nightly lane, its runner, its budget and the issue-filing land with the release
  # train in Phase 0 PR 7, where the CI-credentials question is answered anyway. When it does, the
  # job body is roughly:
  #
  #   example-endpoint-eval:
  #     name: eval / example-endpoint
  #     needs: guard
  #     runs-on: ubuntu-24.04
  #     timeout-minutes: 30
  #     steps:
  #       - uses: actions/checkout@<pinned-sha>
  #       - uses: ./.github/actions/setup-toolchain
  #       - env:
  #           DKP_EVAL_RUNNER: <the agreed runner>
  #           # the agreed API-key secret, once branch-protection and the budget are settled
  #         run: make eval-example-endpoint
  #     # A failure files against EXAMPLE_ENDPOINT.md / RECIPES.md, never against the code, and joins
  #     # the single nightly issue via nightly-report below.

  # ---------------------------------------------------------------------------------------------
  # links — external link checking, deliberately NOT in PR CI.
  # ---------------------------------------------------------------------------------------------
  links:
    name: links / lychee
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 20 --max-retries 2
            --accept 200,206,429
            --exclude-path test/fixtures --exclude-path test/golden
            './**/*.md' './docs/**/*.md'
          output: lychee-report.md
          fail: true
        # 429 is accepted: several docs targets rate-limit CI IPs and a rate limit is not a dead
        # link. The P99 wiki and Discord invite links are the ones that actually rot.

  # ---------------------------------------------------------------------------------------------
  # fonts — the vendored Inter faces are a Latin SUBSET this repository generated
  # (scripts/subset-fonts.sh), not bytes anyone can download and compare. That trade is only
  # acceptable while the derivation is reproducible, so this job re-runs it and diffs: pull
  # Inter-4.1.zip, verify its SHA-256 and the two source faces', re-cut the subset with the pinned
  # pyftsubset flags, and require the result to be byte-identical to what is committed.
  #
  # HERE AND NOT IN ci.yml, by this file's own rule. It downloads 33 MB from a GitHub release and two
  # wheels from PyPI, so its failure is not deterministic given a PR's diff — blocking a P99 parser
  # fix on a PyPI outage is exactly the trade the header forbids. The offline half of the gate does
  # run per PR: test/repo/web_fonts_subset_test.go checks the checksum table against the committed
  # bytes, the provenance hashes against the script's constants, the stylesheet's unicode-range
  # against the subset range, and every font-variant-* declaration against the retained features.
  #
  # A failure here means the committed faces are not what the recipe produces — hand-edited bytes, a
  # re-tagged upstream release, or a parameter changed without regenerating. None of those are
  # things a nightly should fix silently, which is why the job diffs rather than committing.
  # ---------------------------------------------------------------------------------------------
  fonts:
    name: fonts / subset-reproducible
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make verify-fonts
        # No setup-toolchain: this needs python3 and unzip, both preinstalled on the runner, and no
        # Go at all. fonttools and brotli are pinned in the script and installed into a throwaway
        # venv — `make setup` gains nothing and neither does any lockfile.

  # ---------------------------------------------------------------------------------------------
  # File ONE issue for the whole night, not one per job. A nightly that opens six issues gets muted.
  # ---------------------------------------------------------------------------------------------
  nightly-report:
    name: nightly-report
    if: always() && needs.guard.result == 'success'
    needs:
      - guard
      - importer
      - property-deep
      - perf-standings
      - replay-ledger
      - shuffled-suite
      - postgres-convergence
      - image-arm64
      - river-soak
      - upgrade-ladder-enumerate
      - upgrade-ladder
      - links
      - fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: make nightly-report
        # Green: does nothing, and closes yesterday's issue if it is still open.
        # Red: updates the single open `nightly` issue in place with the failing job names, the run
        # URL, and — for each failure — the exact local reproduce command. The deletion rule applies
        # here too: any check whose failure a maintainer cannot diagnose in 60 seconds is deleted.
        #
        # `skipped` IS NOT RED, and the Phase 8 implementation must test for `failure`/`cancelled`
        # rather than for `!= 'success'`. `upgrade-ladder` skips on every night with nothing
        # published to upgrade from (issue #255), which is the ordinary state of this repository
        # until Phase 8 publishes a release — reading that as a failure would file an issue about
        # the absence of releases, nightly, forever. Today's target is a `notyet` stub that reads
        # RESULTS and does nothing, so the contract is a note for whoever fills it in.
