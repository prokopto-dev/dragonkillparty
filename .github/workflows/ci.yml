# PARTLY IMPLEMENTED. Every step shells out to a `make` target, and several of those targets are
# still `notyet` stubs in the Makefile. The job graph, triggers, concurrency, caching and the
# `ci-required` gate are real and final; some of the work inside them is not. `make status` lists
# what remains, derived from the `notyet` call sites rather than from a hand-maintained list here.
#
# Landed so far: Phase 0 PR 1 (the workflows themselves and `ci-required`) and Phase 0 PR 12 (supply
# chain), whose three controls are now all real — action pinning as PIN001 in scripts/repo-gates.sh,
# `security / licences` over internal/licence, and `security / govulncheck`. All three are
# required jobs and none is `continue-on-error`. See ROADMAP.md and
# docs/design/06-cicd-and-release.md.
#
# BUDGET — this is an SLO, not an aspiration. A non-draft PR reaches `ci-required` green in
#   <= 6 min p50, <= 10 min p95, measured push-to-green.
#   A draft PR reaches lint + unit green in <= 90 s.
#   No single job may exceed 5 minutes; one that does gets sharded or moved to nightly-verify.yml.
# The critical path is `changes -> build / binary -> test / e2e`. Everything else fits underneath it.
# `build / binary` uploads an artifact precisely so no other job rebuilds; a second Go+Vite build
# would put e2e past nine minutes on its own. ci-budget.yml measures the last 200 runs weekly.
#
# THREE TIERS, and the tier is the `if:` (issue #159):
#   per-PR      the default. Everything below without a tier note.
#   deep        non-draft PRs and queue runs: `test / e2e`.
#   post-merge  not a pull request at all: `build / image`, whose amd64 build and first-boot smoke
#               is the last check whose failure a PR author can neither cause nor usefully act on.
# `test / importer` used to be a fourth, deep-and-path-filtered case; it is nightly-verify.yml's
# now, where the whole fixture matrix runs. Both moves are honest only because ci-required asserts
# each tier ran when its condition held — a skip that nobody asserts against is a green tick for
# work nobody did, which is what #101 deleted two jobs for.
#
# THE PER-PR TEST SUITE CACHES (issue #155). `make test` runs in two lanes: packages that can spawn
# a subprocess keep `-shuffle=on -count=1`, and everything else may be served from `go test`'s
# result cache, so a re-push with no source change reports `(cached)` for the packages it did not
# touch. `-shuffle=on` still runs over the whole suite every night — nightly-verify.yml's
# `suite / shuffled`. See the Makefile's GATE_DIRS block for why the split is where it is.
#
# ACTION PINS — third-party actions are pinned to a full commit SHA with the version in a trailing
# comment. Do not add an action without a SHA: `lint / repo` fails on any `uses:` ending in a bare
# tag (PIN001), and Renovate's `helpers:pinGitHubActionDigests` maintains the digests thereafter.
#
# What is NOT yet checked: that each digest is the commit its trailing comment claims. PIN001
# asserts the SHAPE of a pin, not its truth, so a digest that does not match its `# v7.0.1` comment
# passes today. `make verify-action-pins` is currently an alias for the same script and adds
# nothing. Resolving each tag against the upstream repository needs authenticated, rate-limited
# GitHub API calls from a lint job — a non-hermetic gate that is its own design question, tracked
# separately. Treat the digests as unverified until it lands.

name: ci

on:
  pull_request:
    # ALL FOUR ARE LOAD-BEARING. Declaring `types:` REPLACES the default
    # [opened, synchronize, reopened] rather than extending it, so dropping one here silently stops
    # CI running on that event — `synchronize` in particular is every push to an open PR.
    #
    # `ready_for_review` is the one that was missing (issue #82). `deep` below reads
    # `github.event.pull_request.draft`, and the whole draft tier assumes leaving draft
    # re-evaluates it. It does not, unless the workflow listens for the event that clears the gate:
    # a PR opened as a draft, marked ready and merged with no further push reached `main` with
    # `test / e2e` (and, at the time, `test / importer` and `build / image`) never having run, and
    # `ci-required` green the whole way — exactly the flow CONTRIBUTING.md documents. No merge queue
    # (`required_merge_queue: null`), so `merge_group` is not a fallback, and `push` is after the
    # merge rather than before it. TestCIWorkflow_PullRequestTrigger_ListensForReadyForReview pins
    # this list.
    types: [opened, synchronize, reopened, ready_for_review]
  # Kept deliberately, and it gates NOTHING (issue #101). There is no merge queue on this repository
  # — `required_merge_queue: null` — so this trigger never fires, and no job below may be conditioned
  # on it: `ci-required` counts `skipped` as success, so a `merge_group`-only job reports as
  # satisfied on every PR and is indistinguishable in the checks list from one that did the work.
  # Two such jobs (`mq / image-arm64`, `mq / upgrade-from-latest-release`) and two
  # `|| github.event_name == 'merge_group'` escape hatches were deleted rather than enabled; #108 and
  # #109 track the coverage they claimed. TestCIWorkflow_NoJob_IsGatedOnMergeGroup pins that rule.
  #
  # The trigger itself is the half with no downside. If a merge queue is ever switched on — a
  # repository-settings change, not a PR — the whole workflow runs in the queue exactly as it does on
  # a PR, rather than `ci-required` never reporting and the queue wedging on a check that never
  # arrives. Adopting the queue means re-adding the expensive tier in the same change.
  merge_group:
  push:
    branches: [main]

# Least privilege at the workflow level; a job that needs more elevates itself.
permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs — the single biggest minute saver in an agent-driven repo, where six
  # pushes in four minutes is normal. NEVER cancel main, tags or merge_group: a cancelled
  # merge-queue run wedges the queue.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local # never silently download a different compiler than go.mod pins
  DKP_ENV: test # turns on the response-validation middleware
  FIXTURES: ghcr.io/${{ github.repository_owner }}/dkp-fixtures

jobs:
  # ---------------------------------------------------------------------------------------------
  # changes — the path filter. Has NO `if:` and must never gain one: `ci-required` treats `skipped`
  # as success, so this job is the fixed point the gate measures everything else against.
  # ---------------------------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      go: ${{ steps.filter.outputs.go }}
      code: ${{ steps.filter.outputs.code }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
      api: ${{ steps.filter.outputs.api }}
      authz: ${{ steps.filter.outputs.authz }}
      pointmath: ${{ steps.filter.outputs.pointmath }}
      docs: ${{ steps.filter.outputs.docs }}
      actions: ${{ steps.filter.outputs.actions }}
      shell: ${{ steps.filter.outputs.shell }}
      # deep == "run the expensive jobs". Draft PRs get lint + unit only.
      #
      # `merge_group` is a term here for the reason the trigger comment above gives, and it is not an
      # escape hatch from a path filter — those were removed with the mq jobs (#101). It says a queue
      # run, should one ever happen, is a deep run and not a draft one; without it a queue run would
      # skip test / e2e and ci-required's DEEP assertion would not fire.
      deep: ${{ github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
      # postmerge == "this run is not a pull request", so it is main after a merge, or a queue run.
      # The tier issue #159 added, and it holds exactly one job: `build / image`.
      #
      # It is NOT the draft gate with a different name. `deep` says "this PR is reviewable, so pay
      # for the expensive checks"; this says "the PR is already merged, so this check is no longer
      # buying the author anything a reviewer can act on". The amd64 image build plus its first-boot
      # smoke is five to six minutes on the PR path for a failure mode a PR almost never introduces
      # — and the parts of it that a PR CAN introduce (the Dockerfile's hardening, the SPA build
      # stage, the context allowlist) are policed on every PR by test/repo's release_gates_test.go
      # and spa_pipeline_test.go, which read deploy/** through the `go` filter.
      #
      # A job that never runs on a PR and sits in ci-required's needs is the #101 shape — skipped
      # counts as success — so this one is asserted NOT skipped when postmerge is true, exactly as
      # the deep jobs are. See ci-required's Gate step.
      postmerge: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # Inline rather than a separate file: one fewer artefact that can drift from the job graph.
          #
          # EVERY filter below includes the Makefile and setup-toolchain, because every job it
          # gates is invoked as `make <target>` and gets its toolchain from that action. A change
          # to either can break a job without touching a file the filter names, and the omission is
          # self-concealing: the PR that rewrote the lint-go and test-unit recipes skipped
          # lint / go and test / unit and reported green through ci-required. A filter that
          # excludes the file defining a job is the same defect as a target that exits 0 without
          # doing the work — and half-fixing it, for the `go` filter only, would leave lint / web,
          # budget / bundle and test / migrations with exactly that hole.
          #
          # THE FILTERS ARE NESTED, and the nesting is the anti-silent-skip rule from the paragraph
          # above meeting issue #159's "stop running the 8-minute suites on a mockup refresh".
          #
          #   build      the Makefile and the toolchain action: in EVERY filter, for the reason
          #              above — every job is `make <target>` and gets its tools from that action
          #   code       *build plus the product's own sources and everything ONLY the full suite
          #              reads. The heavy suites gate on this
          #   go         *code plus the non-Go files a test/repo suite reads. `test / unit` and
          #              `lint / go`'s neighbours gate on this
          #
          # `go` is therefore a strict superset of `code`, which is what makes the narrowing safe:
          # every input pinned to `go` by issue #94 still selects `test / unit`, and every suite
          # those inputs justify runs there under -short. What a web-only or mockup-only PR now
          # skips is `test / integration`, `test / property`, `test / coverage-floor` and
          # `test / authz-matrix` — none of which reads a stylesheet. A pattern may only be in `go`
          # rather than `code` when the suite that reads it is NOT skipped by -short, and
          # test/repo/ci_path_filters_test.go names each one with its reader and checks that.
          filters: |
            build: &build
              - 'Makefile'
              - '.github/actions/setup-toolchain/**'
            code: &code
              - *build
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              # The gate scripts, in `code` rather than in the *build anchor. Their negative
              # fixtures live in test/repo and run under `make test`, so a change here must reach
              # `test / integration` or a scripts-only PR edits a gate and runs none of the tests
              # that prove it fires. Putting them in *build would have been the lazy way to get
              # that, and would also drag in the web, api and docs jobs, none of which can be
              # affected by a shell gate.
              - 'scripts/**'
              # The two worked-example documents, in `code` for the same reason as the gate
              # scripts. TestDocs_ExampleEndpointSnippets_Compile (internal/api) extracts and
              # rebuilds every fence in them and runs under `make test`; without these two lines a
              # docs-only edit to EXAMPLE_ENDPOINT.md — which selects only the `docs` filter, not
              # `code`/`db` — would SKIP `test / integration` and the snippet gate would silently
              # stop running on the exact files it polices. That is the self-concealing omission the
              # header above warns about, so the anti-rot gate is anchored to its own inputs here.
              - 'internal/api/EXAMPLE_ENDPOINT.md'
              - 'db/RECIPES.md'
              # The tracked git hooks, for the same reason as scripts/** above: test/repo's
              # githooks_test runs .githooks/pre-commit and pre-push under `make test`, so a
              # hooks-only change must reach `test / integration` to exercise that gate.
              - '.githooks/**'
              # The skills' verify scripts: gate_cache_test.go scans .claude/skills for `go test`
              # invocations that dropped -count=1, and that suite runs under `make test`.
              - '.claude/skills/**'
              # The agent-session hooks, in `code` for the same reason as `.githooks/**` above:
              # test/repo's lint_shell_test reads the real .claude/hooks/ tree — it asserts the
              # gate's enumeration actually selects the fail-open command guard — and that suite
              # runs under `make test` (issue #187).
              - '.claude/hooks/**'
              # The golden files themselves, which were in no filter but `db`'s migrations subset:
              # `test / golden` asserts the fixture count is non-decreasing versus origin/main and
              # the parser suite reads them, so a PR that deleted a golden case selected nothing and
              # ran neither. Same self-concealing omission as the four blocks above, found while
              # splitting this filter.
              - 'test/golden/**'
              # .npmrc and deploy/** are test/repo inputs that do NOT qualify for the `go`
              # tier below, and they are here rather than there because their readers are
              # -short-SKIPPED: TestNpmrc_SuppressesALifecycleScript installs a fixture with pnpm
              # and runs only in the full suite, so `test / unit` would not cover a change to
              # either. Same rule as everything in `go`, applied honestly in the other direction.
              #
              # deploy/** was in NO filter at all before issue #94, yet release_gates_test.go
              # polices the Dockerfile's hardening (FROM scratch, USER 65532, VOLUME /data, the
              # HEALTHCHECK that must not touch the database) and spa_pipeline_test.go polices the
              # web stage and the context allowlist — so a Dockerfile-only PR ran none of them.
              # Those two are the whole PR-time story for the image now that `build / image` is
              # post-merge, which is the other reason this line is in the narrower filter.
              - '.npmrc'
              - 'web/.npmrc'
              - 'deploy/**'
              # The web manifest, its lockfile and the overrides register: web_overrides_test.go
              # reads all three (issue #168) and asserts they agree — that every pnpm.overrides entry
              # has a reviewed row saying why it exists and what removes it, that the lockfile records
              # the same override set, and that the pin is what the tree actually resolved. Without
              # these lines an override could be added, changed or left to rot on a PR that selects
              # only `web`, and the register would be checked by nothing.
              #
              # They were in `go` and moved here with issue #186, which is the rule in the header
              # applied rather than argued with. Three of that suite's checks compare the pin against
              # the ranges each parent DECLARES, and those ranges live in each parent's own
              # package.json under node_modules — so they need `pnpm install` to have run, they are
              # -short-SKIPPED, and only `test / integration` installs web dependencies. Left in
              # `go`, a PR that edited nothing but web/package.json would run `test / unit`, skip
              # exactly the three checks that read the manifest it changed, and report green — the
              # self-concealing omission this whole block exists to prevent, arriving through the
              # file most likely to carry a new override.
              - 'web/package.json'
              - 'web/pnpm-lock.yaml'
              - 'web/OVERRIDES.md'
              # THE WORKFLOW FILES THEMSELVES, which were in no filter at all (issue #161) — not in
              # *build, not in `go`, and not in `docs`, whose `**/*.md` cannot match a .yml. So a
              # workflow-only PR selected NOTHING, every test job was skipped, ci-required counted the
              # skips as success, and every test/repo suite that asserts about a workflow did not run:
              # ci_required_test.go (that every job reports into the gate), ci_path_filters_test.go
              # (this block), ci_toolchain_test.go, gate_cache_test.go, migration_gates_test.go,
              # migrate_lint_test.go, release_gates_test.go, contributing_claims_test.go,
              # smoke_scripts_test.go, spa_pipeline_test.go, mockup_gates_test.go and
              # docker_layer_cache_test.go. Renaming a job out of ci-required's needs list, or out of
              # a CONTRIBUTING.md citation, was a change that ran none of the gates that catch it.
              #
              # This block is the sharpest instance of what the header above describes: the test that
              # exists to prove the filters are right was skipped by the filters whenever the filters
              # were what changed.
              #
              # In `code` AND NOT in `go`, which is where issue #161 proposed it. The rule stated in
              # the header decides that: a pattern may sit in `go` alone only when its reader still
              # runs under -short, and gate_cache_test.go, migrate_lint_test.go and
              # ci_path_filters_test.go's own closure test all skip there. `test / unit` would run
              # some of these suites and silently not others, so the input belongs to the tier that
              # reaches `test / integration`.
              #
              # The whole tree, not just ci.yml: every other workflow in it is read by a suite too
              # (release.yml, edge.yml and nightly-verify.yml by the release, smoke, SPA-pipeline,
              # layer-cache and toolchain suites; pages.yml by the mockup gates). fixtures.yml is the
              # one file no suite reads yet — covering it with the same line costs one full test run
              # on a fixtures-only PR, which is the safe direction to be wrong in.
              - '.github/workflows/**'
            go:
              - *code
              # THE TEST/REPO INPUTS THAT ARE NOT SOURCE — issue #94, and the reason `go` still
              # exists as a wider filter than `code`. test/repo runs under `make test-unit` and
              # `make test`; five of its suites read their inputs from web/ and docs/design/:
              #
              #   design_tokens_test.go  tokens.css, base.css, web/src/routes/design.*,
              #                          web/src/components/*.css, docs/design/09 section 2, and
              #                          the Nocturne mockup sheet it diffs .table against
              #   e2e_gate_test.go       web/e2e/axe-allowlist.json, web/playwright.config.ts
              #   web_fonts_test.go      fonts.css, web/src/assets/fonts/**, NOTICE
              #   web_fonts_subset_test  the vendored subsets and THIRD_PARTY_NOTICES.txt
              #   mockup_gates_test.go   the five .dc.html surfaces, index.html and harness/**
              #
              # Without these lines a web-only PR selects `web` and not `go`, every job that runs
              # test/repo is SKIPPED, and ci-required counts a skip as success — so an untokenised
              # colour, a dropped /_design swatch, a `transition` in a component, a Table.css
              # divergence from the mockup, an axe allowlist entry with no issue behind it, or a
              # font landing with no licence record all report green. PR #91 changed five of these
              # files and ran none of the tests that police them.
              #
              # EVERY reader named here runs under -short, which is what lets issue #159 keep them
              # out of `code`: `test / unit` still runs on a web-only PR and still polices all of
              # them, while the four heavy suites no longer rebuild the world because a mockup was
              # refreshed. test/repo/ci_path_filters_test.go pairs each pattern with its reader and
              # fails if that reader ever gains a `testing.Short()` skip.
              - 'web/src/**'
              - 'web/e2e/**'
              - 'web/playwright.config.ts'
              - 'docs/design/09-frontend-and-design-system.md'
              # The whole mockups tree, not just the sheet design_tokens_test.go diffs against:
              # mockup_gates_test.go publishes all five surfaces and runs MOCK001-004 over the
              # result, so its inputs are the .dc.html files, index.html and harness/**. Without
              # this a mockup REFRESH — the change most likely to introduce a binding the runtime
              # cannot resolve — would select `docs` and skip the gate that exists to catch that.
              - 'docs/design/mockups/**'
              - 'NOTICE'
              - 'THIRD_PARTY_NOTICES.txt'
              - '.dockerignore'
              # CONTRIBUTING.md: contributing_claims_test.go resolves every workflow, path and CI
              # job its "Enforced by:" blocks cite (#139), and the file is markdown, so without this
              # line it selects `docs` alone and the gate SKIPS on the one file it polices. A false
              # enforcement promise is added by editing exactly this file and nothing else, which is
              # the change that would run none of it.
              - 'CONTRIBUTING.md'
            web:
              - *build
              - 'web/**'
            db:
              - *build
              - 'db/**'
              - 'atlas.hcl'
              - 'sqlc.yaml'
              - 'internal/store/**'
              # The migrator and its suite. Without these three lines a change confined to
              # internal/migrate/ or to a migration fixture selects only the `go` filter, and
              # `test / migrations` is SKIPPED — which ci-required counts as success. A gate that
              # silently stops running on the changes it exists to police is the exact
              # self-concealing omission the header above warns about.
              - 'internal/migrate/**'
              - 'test/migrations/**'
              - 'test/fixtures/migrations/**'
              - 'test/golden/migrations/**'
            api: &api
              - *build
              - 'internal/api/**'
              - 'internal/authz/**'
              - 'openapi/**'
              - 'clients/**'
            # The authorization matrix is enumerated from the Huma registry, so its inputs are the
            # api surface PLUS the packages that surface is built out of: a type change in
            # internal/core or a store signature can move a verdict without touching internal/api.
            # This list is not judgement — it is `go list -deps ./internal/api/... ./internal/authz/...`
            # restricted to this module, and TestCIFilters_AuthzFilter_CoversTheDependencyClosure
            # recomputes it, so a new import fails here rather than skipping the matrix.
            authz:
              - *api
              - 'go.mod'
              - 'go.sum'
              - 'internal/audit/kinds/**'
              - 'internal/auth/**'
              - 'internal/clock/**'
              - 'internal/core/**'
              - 'internal/guild/**'
              - 'internal/schemaenum/**'
              - 'internal/store/**'
            # The point-math suites: `make test-property` and `make test-coverage-floor`. Same
            # construction as `authz` above and the same test — the dependency closure of the
            # packages those two targets name, and nothing wider. These were on the `go` filter,
            # which meant a mockup refresh or a NOTICE edit ran 200 property checks and a coverage
            # floor over the ledger (issue #159).
            pointmath:
              - *build
              - 'go.mod'
              - 'go.sum'
              - 'internal/account/kinds/**'
              - 'internal/audit/kinds/**'
              # The four auth catalogues are here for the same reason internal/*/kinds are: the
              # point-math suites run `./internal/ledger/...`, which includes internal/ledger/enumgen,
              # and the generator imports every catalogue in the repository (#273).
              - 'internal/auth/appuser/kinds/**'
              - 'internal/auth/feedtoken/kinds/**'
              - 'internal/auth/serviceaccount/kinds/**'
              - 'internal/auth/useridentity/kinds/**'
              - 'internal/authz/role/kinds/**'
              - 'internal/authz/roleassignment/kinds/**'
              - 'internal/clock/**'
              - 'internal/core/**'
              - 'internal/decay/kinds/**'
              - 'internal/ledger/**'
              - 'internal/schemaenum/**'
              - 'internal/store/**'
              - 'internal/strategy/**'
            docs:
              - *build
              - 'docs/**'
              - '**/*.md'
            # The two static gates over the files CI is itself written in (issues #121 and #122).
            # Both are path-filtered because both are about one tree and nothing else can change
            # their verdict — and both include the gate script that drives them plus the pin it
            # reads, which is the anti-self-concealment rule the header states: a filter that
            # excludes the file defining a job is the same defect as a target that exits 0 without
            # doing the work.
            #
            # `.github/actions/**` is in `actions` as well as in the *build anchor, because
            # actionlint resolves `uses:` inputs against the local action's own action.yml — an
            # input renamed there is a workflow error this gate catches.
            actions:
              - *build
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/lint-actions.sh'
            # `.githooks/**` is in `shell` because the hooks ARE shell scripts this gate lints, and
            # .shellcheckrc because it is the file that decides which rules run at all.
            #
            # `.claude/hooks/**` joined with issue #187, and it was in NO filter before that — so a
            # hooks-only PR selected nothing, every job was skipped, and ci-required counted the
            # skips as success. The fifth instance of the omission this block's own header warns
            # about, and the one with the worst blast radius: two of those files decide whether a
            # tool call runs at all, and guard-bash.sh is fail-open by design.
            shell:
              - *build
              - 'scripts/**'
              - '.githooks/**'
              - '.claude/hooks/**'
              - '.shellcheckrc'

  # ---------------------------------------------------------------------------------------------
  # lint — the architectural gates run always. They are the cheapest gate in the repo and the only
  # one that catches an architectural-law violation before a human reads the diff.
  #
  # THEY ARE NOT GREPS, and this header said they were until issue #179. They are internal/repogate:
  # `go/parser` analyzers for the Go-syntax laws, data in internal/repogate/rules.hcl for the
  # config-shaped rules, an HCL parse for ENUM001 and an in-process lockmanifest.Verify for MIG003
  # (ADR-0018, ADR-0021, issue #123). scripts/repo-gates.sh is the shim that BUILDS that engine and
  # points it at a tree — a compiled binary, never `go run`, so the exit code survives (ADR-0022).
  #
  # The difference is not cosmetic: "it is a grep" is what an agent reasons from when the next rule
  # lands, and it decides between adding a pattern and writing an analyzer. The wall-clock claim went
  # with it — the cost is one Go build from a warm cache plus one pass over the tree, and the job
  # budget lives in docs/design/06-cicd-and-release.md §4 rather than in two places.
  # ---------------------------------------------------------------------------------------------
  lint-repo:
    name: lint / repo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # REQUIRED, not an optimisation. MIG003 diffs against the merge base: it compares
          # db/migrations-sqlite/SHIPPED.lock with its merge-base version to prove rows were only
          # appended. A shallow checkout downgrades that to a printed skip and a green check.
          # TestCI_LintRepoJob_FetchesFullHistory pins this line.
          #
          # This comment also claimed a "test-integrity analyser" needed the history (issue #167). No
          # CI step runs one: the test-integrity auditor is a subagent in .claude/agents/, invoked by
          # a human or an agent during review, and CONTRIBUTING.md describes it accurately as review
          # rather than enforcement. A false enforcement claim in the CI source is worse than none —
          # it tells a reviewer a weakened assertion would have been caught automatically. Wanting
          # that coverage means adding a step and a negative fixture, not a sentence.
          fetch-depth: 0
      # REQUIRED for the same gate. MIG003 delegates to internal/migrate/shippedlock (issue #129),
      # and repo-gates.sh treats a missing `go` as a MIG003 FAILURE rather than a skip — a hash gate
      # that cannot hash must not report green. The runner image ships some Go, but relying on it
      # would mean this job's toolchain is whatever the base image happens to carry rather than the
      # version go.mod pins. TestCI_LintRepoJob_HasTheGoToolchain pins this step.
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
      - name: Architectural gates and the licence firewall
        env:
          # The pull-request context ADR001 reads. Both are EMPTY on push and merge_group, which is
          # how the rule knows it is not looking at a PR and skips; on a pull_request they are what
          # makes it run at all. Deleting these two lines does not fail anything — it turns the ADR
          # gate into a permanent, silent skip, which is the state #85 found it in. That is why
          # TestCI_LintRepoJob_PassesPullRequestContext pins them.
          #
          # The body is UNTRUSTED input written by whoever opened the PR, so it arrives as an env
          # value and is never interpolated into the `run:` line. GitHub's script-injection
          # mitigation, and the reason this is an `env:` block rather than an argument.
          DKP_ADR_BASE_REF: ${{ github.event.pull_request.base.sha }}
          DKP_ADR_PR_BODY: ${{ github.event.pull_request.body }}
        run: make lint-repo
        # Bans, each with a named rule id and a file:line in the failure message:
        #   sql.Open / *sql.DB / .Query( / .Exec( outside internal/store
        #   an HTTP route declared outside internal/api
        #   float32 / float64 / REAL / NUMERIC / DECIMAL in internal/ledger, internal/strategy
        #   time.Now outside internal/clock; math/rand in internal/strategy
        #   fetch / XMLHttpRequest outside web/src/api; dangerouslySetInnerHTML anywhere
        #   `-update` in any command a CI job runs (the golden-file rewrite fence)
        #   DDL inside a goose `-- +goose Down` block (migrations are forward-only)
        #   a `uses:` line ending in a tag rather than a 40-char SHA
        #   a hand-written string-enum CHECK in db/schema.hcl, outside the GENERATED markers
        #   a PR touching go.mod (new direct dependency), deploy/Dockerfile, db/schema.hcl or
        #     adding a top-level internal/ package, with no ADR and no `adr: n/a — <reason>` line
        #   pdh_ / gen_class / plus_exchange / __multidkp2event outside
        #     internal/importer/legacy_names.go and internal/api/compat  [AGPL firewall]

  lint-go:
    name: lint / go
    needs: changes
    # `code`, not `go`: golangci-lint reads Go sources and .golangci.yml. A stylesheet, a mockup or
    # a NOTICE edit cannot change its verdict, and the suites that DO read those files are gated on
    # the wider filter (issue #159).
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          tools: "gofumpt golangci-lint"
      - run: make lint-go # gofumpt -l, goimports, golangci-lint
      - name: Architectural laws, type-aware (advisory)
        run: make lint-laws
        # ADVISORY, and advisory the way `make image-size` is — and the way `Migration lint` was
        # under issue #131, before #136 promoted it on evidence. The step is NOT
        # `continue-on-error` (this workflow bans that string and TestCIWorkflow_NoContinueOnError
        # asserts its absence — it is the quiet way to keep a gate in the checks list while removing
        # its teeth). scripts/typed-laws.sh is advisory BY CONSTRUCTION: in its default MODE=advise
        # it prints every finding, emits a `::warning::` annotation, and exits 0. MODE=enforce exits
        # non-zero instead and already works; test/repo drives that path so the analyzers are tested
        # rather than trusted. Issue #241 carries what has to be true before this call site flips,
        # in the shape #136 answered for the migration linter.
        #
        # Advisory does not mean it cannot fail. A tree that does not build, or a package that does
        # not type-check, is a hard failure in BOTH modes — a pass that reports "no findings" about
        # code it never read is strictly worse than an absent job.
        #
        # ADDITIVE to `lint / repo` above, never a replacement for it. internal/repogate holds the
        # laws and blocks the merge: it needs no build, so it reads a deliberately tainted tree in
        # t.TempDir() and a repository mid-sequence. What this pass adds is what a syntax rule cannot
        # have — a dot-imported `. "time"`, a type alias reaching *sql.DB, an untyped `0.15` in the
        # point path (issue #172). TestTypedLaws_AreAdditive holds that boundary.
        #
        # IN THIS JOB rather than one of its own: it reads Go sources and nothing else can change its
        # verdict, which is exactly the `code` filter this job already gates on — and the module is
        # already built and cached here by `make lint-go`.
      - run: make mod-tidy-check
        # go.mod and go.sum must ALREADY be tidy (issue #149). Nothing asserted this, so the cleanup
        # arrived attached to whichever PR next happened to run `go mod tidy` — #126 pruned ~100
        # stale `/go.mod` lines from go.sum inside a PR about HTML parsing — and, in the direction
        # that matters more, a PR adding a dependency without tidying left the graph and the lock
        # disagreeing with nothing to say so.
        #
        # In THIS job rather than one of its own: the `code` filter above already selects on go.mod,
        # go.sum and the Makefile, so the inputs that can make this fail are exactly the inputs that
        # run it, and a tidy check is 200 ms against the module cache this job has already warmed.

  lint-web:
    name: lint / web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # `make lint-web` runs `pnpm run lint` (eslint) and, since PR 6 landed web/, the negative
          # fixtures via `pnpm run lint:fixtures`. Both need Node + pnpm on PATH; without node:"true"
          # the job fails "pnpm: command not found".
          node: "true"
      # eslint is a devDependency, and `make lint-web` does not install — do it here, with the same
      # frozen/no-scripts posture CI and the build use, so the linter and the workspace agree.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: make lint-web # eslint over src/**, plus eslint --no-ignore over the negative fixtures

  lint-actions:
    name: lint / actions
    needs: changes
    # Path-filtered to the workflow tree and the gate that reads it. Nothing else can change
    # actionlint's verdict, and a workflow-only PR is exactly when this must run — which it now
    # does, because issue #161 put `.github/workflows/**` into a filter at all.
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # go, because actionlint is `go install`ed from the pin in the Makefile, and because the
          # shellcheck installer derives its destination from `go env GOPATH`.
          go: "true"
          tools: "actionlint shellcheck"
      - run: make lint-actions
        # Issue #121. Most of the phase-0 CI tail this repository fixed by hand was STATIC workflow
        # error that actionlint reports mechanically:
        #   #82   a PR leaving draft never re-ran the required jobs, because declaring `types:`
        #         REPLACES the default event list rather than extending it
        #   #94   web and design gates conditioned on a filter their inputs never select
        #   #101  merge_group-only jobs on a repository with no queue: permanently skipped, and
        #         counted as success by a gate that treats skipped as green
        #   #113  a release smoke pulling GHCR with no docker login
        # It also runs shellcheck over every `run:` block, which is the half `lint / shell` below
        # cannot see — those scripts are embedded in YAML, not in scripts/.

  lint-shell:
    name: lint / shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # shfmt is `go install`ed, and the shellcheck installer derives its destination from
          # `go env GOPATH`, so the toolchain is required even though neither gate compiles anything.
          go: "true"
          tools: "shellcheck shfmt"
      - run: make lint-shell
        # Issue #122. ~4,800 lines of bash across scripts/ and .githooks/ that nothing linted, and
        # two shipped phase-0 bugs that one shellcheck line each would have caught: #84 (a readyz
        # probe that printed "reachable" whether or not the server was) and #111 (an unquoted
        # `$(wc -w)` word-splitting an awk invocation, which killed `make test-coverage-floor` on
        # macOS before it read a single coverage number).

  # ---------------------------------------------------------------------------------------------
  # security — the supply-chain gates. Three of them, and each covers something the other two
  # cannot see:
  #
  #   licences      Go runtime module graph + JS production graph, against a closed allowlist.
  #                 About what a dependency PERMITS, not about defects in it.
  #   govulncheck   Go only, REACHABILITY-aware — call-graph analysis, so a vulnerability is
  #                 reported only when this module's code can actually reach it. High signal.
  #   osv           Go AND npm, reachability-BLIND — every advisory affecting a pinned version.
  #                 Noisier than govulncheck on the Go side, which is why govulncheck stays, and
  #                 the ONLY vulnerability coverage the ~275 package npm graph has ever had.
  #
  # All three are UNCONDITIONAL, and deliberately so. `scripts/**` is in no path filter, so a job
  # whose own definition lives there and which gated itself on `changes` would be the exact defect
  # the filters comment above warns about: a gate that stops running when the file defining it
  # changes. None is on the critical path (changes -> build/binary -> test/e2e), so running them on
  # every PR costs no wall-clock against the budget.
  #
  # None is `continue-on-error`, and all three are asserted in ci-required's always-on list below.
  # ---------------------------------------------------------------------------------------------
  security-licences:
    name: security / licences
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          # `make licence-gate` covers BOTH the Go runtime module graph and, since PR 6 scaffolded
          # web/, the JS production dependency graph via `pnpm licenses list` — so Node + pnpm must be
          # present. The JS half installs web deps itself when node_modules is absent.
          node: "true"
      - name: Dependency licence gate
        run: make licence-gate
        # Fails on any GPL, AGPL, LGPL or CC BY-NC licence, with a named rule id and the dependency at
        # fault, across TWO graphs:
        #   * Go: the RUNTIME module graph (`go list -deps ./...`, without -test). Modules reachable
        #     only from a dependency's own test binary are out of scope — they are not linked into dkp.
        #   * JS: the web/ dependency graph via `pnpm licenses list --json`, checked against the same
        #     closed allowlist plus two reviewed permissive extras (Python-2.0, CC-BY-4.0).
        # Rule ids: LIC001 a denied licence; LIC002 a licence that could not be identified (fails
        # closed). This project is Apache-2.0 and must not take a copyleft dependency in either graph.

  security-govulncheck:
    name: security / govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          tools: "govulncheck"
      - name: Reachable dependency vulnerabilities
        run: make govulncheck
        # `govulncheck ./...` — call-graph analysis, so only vulnerabilities that are actually
        # reachable from this module's code are reported. That is what keeps the signal high enough
        # that people act on it rather than learning to skim past it.

  security-osv:
    name: security / osv
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Known vulnerabilities in the Go and npm dependency graphs
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          # One argument per line — the action passes them to the scanner as argv.
          #
          # BOTH lockfiles are named EXPLICITLY, and this is the load-bearing part of the job. The
          # action's default is `--recursive ./`, which scans whatever it happens to walk into: a
          # lockfile that moves, or a manifest that stops being generated, then reads as "clean"
          # rather than as "not scanned" — the self-concealing omission this workflow's header
          # warns about, in scanner form. Naming them means osv-scanner itself errors when one is
          # absent, so the job cannot quietly cover less than it says it does.
          #
          # go.mod is the reason osv-scanner does NOT replace `security / govulncheck` above:
          # osv-scanner reports every advisory affecting a pinned version, with no call-graph
          # analysis, so it is the noisier of the two on the Go side. It is here because the same
          # blindness is a virtue on the npm side, where nothing else looks at all.
          #
          # TestOSV_ScanTargets_AreTheSameInCIAndTheMakefile keeps this list equal to the one in
          # `make osv-scan`, so a lockfile added to one is not missing from the other.
          scan-args: |-
            scan
            source
            --config=osv-scanner.toml
            --lockfile=go.mod
            --lockfile=web/pnpm-lock.yaml
        # BLOCKING, not advisory (issue #132). Every waiver is an `[[IgnoredVulns]]` entry in
        # osv-scanner.toml carrying a filed issue and an `ignoreUntil` expiry, printed in this job's
        # log when it filters one — so the exceptions are enumerated in a reviewed file rather than
        # implied by a gate that never fails. test/repo asserts an entry cannot exist without both.
        #
        # The action is a Docker action, so the SHA pin above pins the ACTION but its inner
        # `docker://ghcr.io/google/osv-scanner-action:v2.5.0` reference is a mutable tag — the pin is
        # weaker than it looks and it is worth saying so rather than implying otherwise. It is still
        # the right trade here: `go install`ing the scanner would couple this repository's Go patch
        # floor to osv-scanner's (its go.mod requires 1.26.5, and CI runs GOTOOLCHAIN=local), so the
        # day the scanner asks for a patch newer than ours the scan would fail for a reason nobody
        # could act on. Ours is `go 1.26.6` — a security floor set by govulncheck, on its own cadence,
        # which presently clears the scanner's. The container carries its own toolchain.

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          # `make vet` runs `tsc --noEmit` over web/ once the SPA is scaffolded (PR 6). tsc is a
          # pnpm-installed devDependency, so Node + pnpm must be present; the target installs web deps
          # itself when node_modules is absent.
          node: "true"
      - run: make vet # go build + go vet + staticcheck + tsc --noEmit

  # ---------------------------------------------------------------------------------------------
  # drift — two separate gates because they fail for different reasons and have different fixes.
  # ---------------------------------------------------------------------------------------------
  codegen-drift:
    name: gen / codegen-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          # `make verify-generated` runs `make gen`, whose client half (scripts/gen-client.sh) invokes
          # openapi-typescript through pnpm once web/ is scaffolded (PR 6). Node + pnpm must be present
          # or the regen fails "pnpm: command not found"; the script installs web deps itself.
          node: "true"
          tools: "atlas sqlc"
      - name: Regenerate everything and fail on a dirty tree
        run: make verify-generated
        # Today: atlas.sum, the schema/migration sync assertion, sqlc, huma -> openapi.json, and
        # openapi-typescript -> web/src/api/schema.d.ts. openapi-python-client and the generated docs
        # reference pages land in a later phase. On failure this prints exactly one line:
        # "generated files are stale — run 'make gen' and commit".

  spec-drift:
    name: gen / spec-drift
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The operationId-rename check compares against origin/main, which a shallow clone does
          # not have. Without this the gate reports the base revision as unavailable and fails.
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          # `python: "true"` was here, and its removal is the point of issue #127 rather than a
          # trimming. This gate was scripts/verify-spec.py, needing an interpreter that nothing
          # declared until issue #83 — on an older one the script died at import and the failure read
          # as SPEC DRIFT on a tree whose spec was fine. It is internal/specgate now, so the only
          # runtime is the compiler go.mod pins and GOTOOLCHAIN=local forbids swapping. Go was already
          # required here because the gate is worthless against a stale committed spec and `make gen`
          # needs a compiler to regenerate one.
          go: "true"
      - run: make verify-spec
        # internal/specgate, as rules SPEC001-SPEC008, driven by the negative fixtures in
        # test/repo/spec_gate_test.go.
        #
        # Asserts properties of openapi/openapi.json that codegen-drift cannot see because they are
        # true of any regenerated file: every operation has an explicit lowerCamelCase operationId,
        # operationIds are unique and none was RENAMED versus origin/main (a renamed operationId is
        # a breaking SDK change with an unchanged HTTP surface), every operation declares Security
        # and x-dkp-permission, every x-dkp-permission key exists in internal/authz/catalogue.go,
        # every money field is an unquoted integer named *_centipoints and nothing on the wire is a
        # float, and every documented path lives under /api/v1 (SPEC007 — an unversioned path in the
        # document means an infrastructure route was registered without Hidden and is now published
        # API, which is the no-hidden-operations rule seen from the other side).
        #
        # The `Hidden: true` allowlist of canonical conventions section 7 was listed here until
        # PR 4 and has moved to internal/api/arch_test.go, where it is implementable: Huma never
        # adds a hidden operation to `paths`, so a hidden operation is ABSENT from this document
        # and reading the JSON cannot distinguish one that was correctly hidden from one that was
        # never written. The registry can. See TestArch_HiddenOperations_AreAllowlisted.

  # ---------------------------------------------------------------------------------------------
  # test — four fast suites split so a failure names its own category in the checks list.
  # ---------------------------------------------------------------------------------------------
  test-unit:
    name: test / unit
    needs: [changes, codegen-drift]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
      - run: make test-unit

  test-property:
    name: test / property
    needs: [changes, codegen-drift]
    if: needs.changes.outputs.pointmath == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
      - run: make test-property
        # The flagship properties over internal/ledger and internal/strategy: P1 conservation, P2
        # exact splits, P5 reversal is an exact inverse, P8 determinism, and no float anywhere in a
        # proposal. 200 checks here, 20 000 in nightly-verify.yml's property-deep job.
        #
        # testing/quick plus seeded generators, NOT pgregory.net/rapid. rapid is a new dependency and
        # AGENTS.md requires a human to approve one, which the design documents assuming it does not
        # change; internal/ledger/property_test.go records the deviation in full. The base seed is
        # FIXED and printed, so a counterexample replays with DKP_PROPERTY_SEED=<n> rather than being
        # gone by the time anybody looks.
        #
        # Separate from test / unit because a property failure is a counterexample to a claimed
        # invariant, not a broken function, and the triage path is different: shrink it by hand from
        # the printed seed, add the minimised case to a table test, then fix.
      - name: Upload counterexamples
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: property-counterexamples
          path: test/property/failures/
          if-no-files-found: ignore

  test-coverage-floor:
    name: test / coverage-floor
    needs: [changes, codegen-drift]
    if: needs.changes.outputs.pointmath == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
      - run: make test-coverage-floor
        # A JOB, not a report — Phase 0 PR 10's acceptance criterion, and the distinction is the
        # whole point: a coverage number printed in a log is a number nobody reads, and a coverage
        # number that fails a required check is a floor.
        #
        # internal/ledger and internal/strategy at 95%. They are the two packages where an uncovered
        # branch is a branch that reallocates points across the whole guild the first time it runs,
        # and they are small enough that 95% is reachable without writing tests for the sake of the
        # number. The target refuses to pass when it measured fewer packages than it expected, so a
        # deleted test suite fails here rather than disappearing from the average.

  test-golden:
    name: test / golden
    needs: [changes, codegen-drift]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # `make test-golden` is a Go test binary (a `notyet` stub until Phase 4, then the parser
          # golden suite), and this job declared NOTHING — every input defaults to "false", so it
          # installed no Go at all (issue #156). Two costs, and the second is the one that bites:
          # a cold compile on every run, and, because ci.yml sets GOTOOLCHAIN=local deliberately, the
          # first go.mod bump past the runner image's Go turns this job red with a toolchain error
          # rather than a test failure — in a job whoever bumped go.mod never touched.
          go: "true"
      - env:
          CI: "true" # the golden harness refuses `-update` when CI=true
        run: make test-golden
        # Also asserts the fixture count under test/golden/ is NON-DECREASING versus origin/main.
        # Deleting a golden case to go green is the failure mode this exists to catch.

  test-integration:
    name: test / integration
    needs: [changes, codegen-drift]
    # `code`, not `go` (issue #159). This is the 8-minute job and it was running on every mockup
    # refresh, every NOTICE edit and every stylesheet change, because those files are pinned to
    # `go` so that test/repo's -short suites reach `test / unit`. They still do; what they no
    # longer do is drag the full race suite in behind them.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.db == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          # internal/core's TestLintBan_* meta-tests exec `golangci-lint` against
          # testdata/lintfixtures/* to prove each arithmetic ban actually fires. They are gated out
          # of the -short unit run and execute in this full suite, so this job needs the linter on
          # PATH — without it they fail-loud with "golangci-lint not on PATH".
          #
          # gofumpt is here for test/repo's githooks_test: it runs .githooks/pre-commit and
          # .githooks/pre-push against a real staged, mis-formatted Go file in t.TempDir() and
          # asserts the hooks format and block. Without gofumpt on PATH that functional test skips,
          # and the gate would go unexercised in CI — the exact "green build that ran nothing" this
          # repo's test-the-gate ethos exists to prevent.
          #
          # atlas is here for the same reason, and it closes an instance of that defect that was
          # already live: test/repo's atlas_lock_test.go and new_migration_test.go both skip when
          # atlas is absent, and this job never installed it — so the suite proving issue #36's
          # per-invocation dev-url fix has been silently skipping in CI. It also runs
          # migrate_lint_test.go, whose fixtures drive scripts/migrate-lint.sh against a fabricated
          # migration directory in t.TempDir() to prove the enforcing default fails on a diagnostic,
          # that a 12-step rebuild is not one, and that `-- atlas:nolint` waives one — the negative
          # fixtures for the gate added in issue #131 and promoted in #136.
          # actionlint, shellcheck and shfmt for the negative fixtures of the two gates added in
          # issues #121 and #122: test/repo drives scripts/lint-actions.sh against a workflow with an
          # undefined `needs:` and scripts/lint-shell.sh against a word-splitting script, both in
          # t.TempDir(). Without the tools on PATH those fixtures cannot run — and since issue #177
          # they no longer skip quietly when that happens, they FAIL, which is what makes this line a
          # requirement rather than an optimisation.
          tools: "golangci-lint gofumpt atlas actionlint shellcheck shfmt"
          # test/repo's python_floor_test.go re-parses every scripts/*.py at the declared floor with
          # ast.parse(feature_version=...), which is the check that stops CI's newer interpreter
          # accepting syntax a contributor's laptop cannot run. It is gated out of the -short unit run
          # and executes here. (The spec-gate fixtures were the other reason for this line; they run a
          # Go command since issue #127 and need no interpreter.)
          python: "true"
          # NODE, AND IT CLOSES A GATE THAT HAS NEVER RUN IN CI (issue #177). No job that runs
          # `make test` installed Node, so every test gated on `exec.LookPath("pnpm")` skipped here,
          # silently, on every run — including TestNpmrc_SuppressesALifecycleScript, the ONLY
          # functional proof that web/.npmrc's ignore-scripts actually stops a dependency's
          # postinstall. `lint / web` covers the eslint half functionally; nothing covered that one.
          #
          # The #83/#156 defect class one step removed: not a job that fails for the wrong reason,
          # but a job whose green includes a suite that never ran.
          node: "true"
      # The eslint negative fixtures (TestWebLint_BareFetch_FailsLint and its four neighbours) run
      # eslint through web/node_modules/.bin, so Node on PATH is necessary and not sufficient. The
      # same frozen, no-scripts posture every other install in this repository uses — ~20 s against
      # the pnpm store this action caches.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: make test
        # Real SQLite in t.TempDir(), real migrations, real River workers, real append-only
        # triggers. Mocks are banned here: a mocked store does not fire the trigger, which is the
        # thing under test. Response-validation middleware on; statement-count budgets; goleak.
      - name: Template-clone cost (verify-before-phase-0 item V4)
        run: make bench-clone
        # Prints the p50 of 200 independent BenchmarkNewDB_Clone samples. "Integration tests are
        # nearly free" is the thesis the whole test pyramid inverts on, and this is the only place
        # the number is observed on CI hardware rather than on somebody's laptop. It is a printed
        # measurement, not a threshold: a regression is read in the log, not enforced here, because
        # a wall-clock assertion on a shared runner is a flake generator.

  test-migrations:
    name: test / migrations
    needs: [changes, codegen-drift]
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # REQUIRED by the migration-lint step below, not an optimisation.
          # scripts/migrate-lint.sh selects what to analyse with `atlas migrate lint --git-base
          # origin/main`, so that only the migrations this branch ADDS are analysed — a shipped
          # migration is frozen (MIG003), so a diagnostic on one is not actionable by whoever trips
          # over it. A shallow checkout has no origin/main, which downgrades the script to its
          # printed `--latest 1` fallback: it would still run and still exit 0, and the log would
          # say so, but a branch adding two migrations would have the first go unanalysed.
          # TestCI_MigrationLintStep_FetchesFullHistory pins this line.
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          # atlas, for the migration lint below. It is the authoring tool for everything in
          # db/migrations-sqlite/ and is already installed in `gen / codegen-drift`; this is the
          # second job that needs it on PATH. Without it scripts/migrate-lint.sh hard-fails with
          # "atlas is not installed" rather than skipping, which is the intended behaviour — a gate
          # that exits 0 because the analyser was absent reports "no diagnostics" about migrations
          # it never read.
          tools: "atlas"
      - name: Migration lint (gate)
        run: make lint-migrations
        # A GATE since issue #136, having landed advisory-first under #131 while the analyzers were
        # unproven against SQLite's 12-step rebuild. `make lint-migrations` passes MODE=enforce and
        # the script defaults to it, so a destructive, data-dependent or backward-incompatible
        # diagnostic fails this job — and fails `make check` on a laptop first, which is the point
        # of putting the mode in the Makefile rather than only here.
        #
        # NOT `continue-on-error` — this workflow bans that string and TestCIWorkflow_NoContinueOnError
        # asserts its absence, because it is the quiet way to keep a gate while removing its teeth.
        # The reviewable way past a diagnostic is a `-- atlas:nolint <analyzer>` directive in the
        # migration beside the `-- dkp:destructive-approved: #<issue>` line the two-release
        # destructive rule already requires, which puts the exception in the diff.
        #
        # A migration Atlas could not analyse at all, or an invocation that produced no report, is a
        # hard failure in EITHER mode — because a scan that never ran must not report as a scan that
        # found nothing.
        #
        # ADDITIVE to `make test-migrations` below, never a replacement for it — and no less so now
        # that it blocks. Atlas's analyzers know about destructive, data-dependent and
        # backward-incompatible changes; they know nothing about forward-only migrations (MIG001),
        # the SHIPPED.lock history rule (MIG003), the fresh-install fingerprint, or append-only
        # triggers surviving a 12-step table rebuild. Issue #131 said so, #136 restated it, and
        # TestMigrationGates_AtlasLint_IsAdditive holds it.
        #
        # Deliberately BEFORE `make test-migrations`: it costs ~30 ms and a destructive-change
        # diagnostic is the most useful thing to read first when the suite after it goes red.
      - run: make test-migrations
        # Landed in Phase 0 PR 3: 1, 6 and 7 below, plus STRICT-on-every-table and no-guild_id.
        # Still owed, and by whom: 2 and 3 need a published reference database (`release-refdb`,
        # Phase 8); 4 and 5 need the ledger tables and their triggers (Phase 0 PR 9). The list is
        # kept whole rather than trimmed to what runs, because it is the specification.
        # 1. fresh install: empty -> HEAD, PRAGMA integrity_check after every step
        # 2. N-1: pull $REFDB:$(cat .support/oldest-tested) -> HEAD
        # 3. the schema fingerprint of (1) equals the fingerprint of (2)
        # 4. protected-table row counts and column digests NON-DECREASING across every migration
        #    (ledger_batch, ledger_entry, raid, tick, attendance, award, adjustment, person,
        #     character, item) — SQLite's 12-step table rebuild is where a mistyped column list
        #     silently drops a column's data
        # 5. the append-only triggers still fire AFTER the full migration set
        # 6. a deliberately corrupted migration exits non-zero AND leaves the database
        #    byte-identical to the pre-migration snapshot
        # 7. every `-- +goose Down` block is a RAISE(ABORT), never DDL — migrations are
        #    forward-only, so there is no down path to test and there never will be

  test-authz:
    name: test / authz-matrix
    needs: [changes, codegen-drift]
    if: needs.changes.outputs.authz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # Same defect as `test / golden` above (issue #156): this job asked for nothing and then ran
          # a Go target. `make test-authz` enumerates the matrix from the Huma registry, so it is a Go
          # test binary the moment it stops being a stub, and it needs the compiler go.mod pins rather
          # than whichever Go the runner image happens to ship.
          go: "true"
      - run: make test-authz
        # Every (operation x principal) cell, enumerated from the Huma registry rather than written
        # by hand, so a new endpoint cannot be added without a verdict for every principal kind.
        # Asserts in particular: no PAT scope reaches a session+step-up operation (token minting,
        # role edits, backup download, bulk PII read, import commit), and effective capability is
        # exactly `role permissions INTERSECT token scopes`. This is the suite that catches an
        # endpoint shipped without `Security` more usefully than the spec gate does, because it
        # proves the runtime behaviour rather than the declaration.

  # ---------------------------------------------------------------------------------------------
  # api / breaking-change — oasdiff against origin/main's committed spec.
  # ---------------------------------------------------------------------------------------------
  api-breaking:
    name: api / breaking-change
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the sticky changelog comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          # oasdiff is a Go program installed with `go install`, so this job needs Go on PATH before
          # it needs oasdiff — and it declared neither (issue #156). The tools list installs it
          # through the same pinned path every other tool takes; the pin itself lands with the PR that
          # promotes `make api-breaking` off its stub (Phase 2), which is why the action's oasdiff
          # case is the one `go install ...@latest` entry.
          go: "true"
          tools: "oasdiff"
      - name: oasdiff breaking + changelog
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          # The label is author-settable, so it is a "did you notice" control, not a security
          # control. CODEOWNERS on docs/api-changelog.md converts it into a review control.
          BREAKING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, '!breaking-api') }}
        run: make api-breaking
        # Fails on a breaking delta unless BOTH: the PR carries `!breaking-api` AND the PR modifies
        # docs/api-changelog.md. /api/v1 is additive-only forever; a genuinely breaking change mints
        # /api/v2 and ships in an app MINOR (see docs/design/06-cicd-and-release.md section 5).
      - name: Post the API delta in English
        if: github.event_name == 'pull_request'
        run: make api-changelog-comment
        # `oasdiff changelog` as a sticky comment. Reviewers read prose, not a JSON diff.

  # ---------------------------------------------------------------------------------------------
  # build — one build, many consumers. Everything downstream downloads this artifact.
  # ---------------------------------------------------------------------------------------------
  build-binary:
    name: build / binary
    needs: [changes, codegen-drift]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      # Whether a binary actually exists. Pre-Phase-0 `make build` is a no-op, so downstream
      # consumers must not try to download an artifact that was never produced. This output
      # removes itself: once cmd/dkp has sources, it is permanently 'true'.
      built: ${{ steps.built.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          go: "true"
          # `make build` runs scripts/build-web.sh (Vite build via pnpm) before `go build`, so the
          # binary embeds the real SPA rather than the placeholder. Node + pnpm must be present or the
          # build fails "pnpm: command not found"; the script installs web deps itself.
          node: "true"
      - run: make build # pnpm build -> go:embed -> go build, CGO_ENABLED=0
      - name: Detect binary
        id: built
        run: |
          if [ -f bin/dkp ]; then echo "built=true"  >> "$GITHUB_OUTPUT"
          else echo "built=false" >> "$GITHUB_OUTPUT"
               echo "::notice::no binary yet — cmd/dkp lands in Phase 0 PR 1"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.built.outputs.built == 'true'
        with:
          name: dkp-linux-amd64
          path: bin/dkp
          retention-days: 7

  build-image:
    name: build / image
    needs: [changes, build-binary]
    # POST-MERGE, not per-PR (issue #159). It is five to six minutes of Vite + Go + image build for
    # a failure a PR rarely causes, and the parts a PR CAN cause are already policed on the PR path
    # by test/repo: release_gates_test.go on the Dockerfile's hardening, spa_pipeline_test.go on the
    # web stage and the build-context allowlist, both gated on deploy/** via `code`. What is left
    # here — does the image actually build, boot, answer /healthz then /readyz, and fit the size
    # budget — now runs on main immediately after the merge, in nightly's arm64 cross-build, and as
    # release.yml's `smoke` gate against the published digest before any moving tag advances.
    #
    # The layer-cache doctrine below is unchanged and still load-bearing: main writes, a queue run
    # reads. See ci-required's POSTMERGE assertion for why a job nobody runs on a PR is still safe
    # to leave in the needs list.
    if: needs.changes.outputs.postmerge == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # --- The Docker layer cache (issue #119) ---------------------------------------------------
      #
      # These two env vars existed before this block did, describing a careful policy that nothing
      # implemented: `make docker` passed no cache flags and BUILDX_CACHE_FROM/TO are not variables
      # buildx itself honours, so every non-draft push paid an uncached Vite + Go + image build while
      # a five-line comment said the caching question was settled. The Makefile recipe reads them now
      # — the shape scripts/release-image.sh already uses on the release path.
      #
      # WHY type=local AND NOT type=gha. The gha backend is the obvious choice and it cannot be used
      # from a `run:` step: buildx authenticates to the Actions cache service with ACTIONS_RUNTIME_
      # TOKEN, which GitHub injects into JS actions only, never into a script step. Exposing it needs
      # a third-party action, and adding a dependency is a human's decision (AGENTS.md). type=local is
      # backed by actions/cache, which is already pinned here and already carries the doctrine below.
      #
      # THE RELEASE PATH NOW ANSWERS THE SAME WAY. scripts/release-image.sh asked buildx for
      # `--cache-from type=gha` from a `run:` step, so the release and edge image builds carried a
      # cache that could not authenticate and was inert (issue #163). Rather than take the dependency
      # to rescue it, release.yml and edge.yml moved onto this backend and this doctrine — one
      # mechanism to understand instead of two, and no third-party action in a job holding
      # `packages: write`. test/repo/docker_layer_cache_test.go asserts the gha backend is now named
      # in no script and no workflow.
      #
      # READ EVERYWHERE, WRITE ON MAIN — the same rule as the Go build cache in setup-toolchain, and
      # the reason is the same: Actions caches are branch-scoped with read-through to the default
      # branch, so a PR's write is invisible to every other PR and is evicted almost immediately.
      #
      # THE KEY ROLLS, AND ITS MIDDLE SEGMENT IS CONTENT. Actions cache entries are IMMUTABLE, and an
      # exact hit makes actions/cache SKIP its post-job save — so a key that did not roll would be
      # written the first time it existed and never refreshed again: main would export a fresh cache,
      # swap it into place, and upload nothing, forever. The key therefore ends in the commit sha,
      # exactly as the Go build cache's does, so main never hits it exactly and always writes.
      #
      # The hash of deploy/Dockerfile and the two lockfiles sits in the MIDDLE because that is what
      # decides whether the expensive stages are reusable at all: the first restore-key falls back to
      # the newest entry that shares it, and only then to the newest entry from any. Old per-commit
      # entries are the least-recently-used things in the pool by construction — nothing restores
      # them again — so they are what LRU evicts first.
      #
      # `mode=max` exports every stage, which is the only mode worth exporting here: the final stage
      # is `FROM scratch` with three COPYs, so `mode=min` would archive the one part of this build
      # with nothing expensive in it and leave the Node and Go builder stages, where all the time
      # goes, uncached.
      - name: Restore the Docker layer cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-${{ hashFiles('deploy/Dockerfile', 'web/pnpm-lock.yaml', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildx-${{ hashFiles('deploy/Dockerfile', 'web/pnpm-lock.yaml', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-buildx-

      # Key and restore-keys IDENTICAL to the step above — GitHub supports no YAML anchors in a
      # workflow file, so this is a copy, and TestBuildImage_LayerCache_WritesOnMainReadsEverywhere is
      # what stops the copies drifting.
      - name: Restore and save the Docker layer cache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ runner.arch }}-buildx-${{ hashFiles('deploy/Dockerfile', 'web/pnpm-lock.yaml', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildx-${{ hashFiles('deploy/Dockerfile', 'web/pnpm-lock.yaml', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-buildx-

      - name: Build amd64 and smoke it locally
        env:
          # Read on every branch: a missing or empty src is a buildx WARNING and the build proceeds
          # cold, which is what the first run on a fresh key does.
          BUILDX_CACHE_FROM: type=local,src=/tmp/.buildx-cache
          # Written on main only, and to a DIFFERENT directory than it reads: buildkit's local
          # exporter writes a whole cache but never prunes the one already there, so exporting over
          # the restored copy would grow the entry every run. The step below swaps the fresh export
          # into place for actions/cache's post step to archive.
          BUILDX_CACHE_TO: ${{ github.ref == 'refs/heads/main' && 'type=local,dest=/tmp/.buildx-cache-new,mode=max' || '' }}
        run: make docker
      - name: Roll the layer cache forward (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # No `|| true`: if buildx exported nothing, the cache policy above is not happening and this
          # says so, rather than archiving the restored copy under a fresh key forever.
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: First-boot smoke
        run: make smoke-local
        # docker run, wait for /healthz, then /readyz, then `dkp version`. /healthz never touches
        # the database (canonical conventions section 13) — a DB-touching healthcheck lets Docker
        # kill the container mid-migration.
      - name: Image size (advisory)
        run: make image-size
        # ADVISORY on the PR path, and advisory in the RIGHT way: the step is NOT `continue-on-error`
        # (ci.yml bans that — it is the quiet way to keep a gate while removing its teeth, and a test
        # asserts its absence). Instead scripts/image-size.sh is advisory by construction — in its
        # default MODE=advise it prints the compressed size against the 30 MB budget
        # (docs/design/06-cicd-and-release.md section 7), emits a `::warning::` on a breach, and exits
        # 0 regardless, so a legitimate breach is a signal in the diff, not a merge block. The release
        # train runs the SAME script with MODE=enforce, where a breach is a hard, non-zero failure:
        # a shipped image that blew the budget is a real regression.

  test-e2e:
    name: test / e2e
    needs: [changes, build-binary]
    if: needs.changes.outputs.deep == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # Playwright is a Node tool and `make test-e2e` drives it through pnpm. Without this the
          # job fails "pnpm is not installed"; the script installs web deps itself.
          #
          # No `go: "true"`: the binary arrives as the artifact below rather than being rebuilt here.
          # A second Go+Vite build would put this job past the whole workflow's wall-clock budget,
          # which is why `build / binary` uploads it in the first place.
          node: "true"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # Only when build / binary actually produced one — an output that is permanently 'true' now
        # that cmd/dkp has sources, kept because the job graph should not assume it. If the artifact
        # ever fails to arrive, scripts/test-e2e.sh builds the binary rather than skipping the suite,
        # and fails loudly on a runner with no Go.
        if: needs.build-binary.outputs.built == 'true'
        with:
          name: dkp-linux-amd64
          path: bin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile because that is where the pinned @playwright/test version lives:
          # bumping it must miss the cache, or the run drives last version's browser.
          key: pw-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - env:
          SHARD: ${{ matrix.shard }}/2
        run: |
          if [ -f bin/dkp ]; then chmod +x bin/dkp; fi
          make test-e2e
        # --retries=0, deliberately. A flaky e2e is QUARANTINED, never retried. Retrying converts a
        # four-hour debugging cost into an unbounded recurring one, and a retried test is a test an
        # agent learns to trust when it should not.
        #
        # The target itself fails when a shard selects zero tests: Playwright exits 0 in that case,
        # and a browser job reporting green having opened no browser is the exact defect promoting
        # this target from its stub was meant to remove.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-trace-${{ matrix.shard }}
          path: web/test-results/

  # ---------------------------------------------------------------------------------------------
  # There was a `test / importer` job here, gated on `importer && deep` with a 10-minute timeout.
  # Issue #159 moved it to nightly-verify.yml, which is where the coverage always was: this job ran
  # ONE fixture on a PR that touched the importer, and `importer / ${{ matrix.fixture }}` runs all
  # six every night — the four EQdkp versions, the hostile fixture and the anonymised real dump —
  # with a failure filing an issue rather than blocking a parser fix. The `importer` path filter went
  # with it; internal/importer/** is Go, so `code` still selects the suites that read it.
  #
  # The trade is stated rather than hidden: a PR that breaks the importer is now found by the
  # nightly rather than by its own checks list. That is the tier this repository already puts
  # container-bound, fixture-driven, ten-minute checks in, and the importer's own risk register (R1)
  # is answered by breadth every night, not by one fixture per PR.
  # ---------------------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------------------------
  # budgets — required despite living under a soft-sounding name. A budget is required if and only
  # if its number is fully determined by the diff and fully actionable by the author. Bundle size
  # is; a CVE feed is not, which is why image-cve is advisory and lives in nightly-verify.yml.
  # ---------------------------------------------------------------------------------------------
  bundle-budget:
    name: budget / bundle
    needs: [changes, build-binary]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    # `make budget-bundle` builds the SPA it measures now (issue #166), so this is a pnpm install plus
    # a Vite build rather than a gzip of a checked-out file. Five seconds locally; the headroom is for
    # a cold pnpm store.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # scripts/budget-bundle.sh reads web/bundle-budget.json's max_gzip_bytes with python3 and
          # this job declared nothing, so the interpreter was whatever the runner image shipped
          # (issue #164 — the #83 defect class). If it ever moves, the bundle budget fails as though
          # the BUNDLE were wrong, in a job whoever bumped the image never touched.
          python: "true"
          # Node and pnpm, because the target builds the bundle before measuring it. Until issue #166
          # it did not, and this job was measuring the committed internal/ui/dist placeholder — a
          # required gate reporting 99% headroom against a few hundred bytes of scaffold, on every PR
          # that touched web/. The build lives in the Makefile target rather than in a step here so a
          # laptop and this job measure the same thing, which is the other half of #166.
          node: "true"
      - run: make budget-bundle
        # SPA initial route <= 250 KB gzipped, and <= +5% versus the last release. Breaching it
        # legitimately is a one-line edit to web/bundle-budget.json — reviewed, in the diff, by a
        # human (the file is CODEOWNERS-protected). That turns a size regression into a decision
        # instead of a drift.

  # ---------------------------------------------------------------------------------------------
  # docs — internal links only. External link checking is a nightly job: an external 404 appears on
  # the world's schedule, not the contributor's, and blocking a parser fix on it loses contributors.
  # ---------------------------------------------------------------------------------------------
  docs-build:
    name: docs / build
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          # `make docs-links` is scripts/check-links.py. Same reason as gen / spec-drift: a Python
          # gate whose interpreter nobody declared fails as if the CORPUS were broken (issue #83).
          python: "true"
      - run: make docs-build
        # Builds the site AND the embed.FS the binary serves at /docs, so a docs page that 404s in
        # the container fails here rather than in a guild's install.
      - run: make docs-links
        # Internal links and anchors only, resolved against the embed.FS. Also executes fenced
        # ```dkp:exec blocks so a documented command that no longer exists fails the build.

  # ---------------------------------------------------------------------------------------------
  # There was an `mq` tier here — `mq / image-arm64` and `mq / upgrade-from-latest-release`, both
  # `if: github.event_name == 'merge_group'`, described in docs/design/06-cicd-and-release.md §4 as
  # "required in queue". This repository has no merge queue, so neither ever ran, and because
  # ci-required counts `skipped` as success both reported satisfied on every PR: a two-tier split
  # that existed in the checks list and nowhere else. Issue #101 chose deleting them over enabling
  # the queue. What they claimed to cover is now tracked honestly — #108 for the arm64 image build,
  # #109 for upgrade-from-latest-release — rather than asserted here.
  # ---------------------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------------------------
  # ci-required — the ONLY check in branch protection, alongside DCO.
  #
  # Path-filtered jobs plus required status checks is the classic way to wedge a repo: a skipped job
  # never reports and the PR waits forever. `if: always()` over `needs.*.result` fixes that, but it
  # opens a second hole, because `skipped` must count as success — so a job accidentally skipped by
  # a wrong `if:` would pass silently. Four mitigations, all of which assert the SHAPE of the run
  # rather than only its colour:
  #   1. `changes` has no `if:` and cannot be skipped.
  #   2. Jobs that must always run are asserted to be exactly "success", not "success or skipped".
  #   3. When `deep == true`, the deep jobs are asserted NOT to be in state "skipped".
  #   4. When `postmerge == true`, the post-merge jobs are asserted the same way — the assertion
  #      that keeps a tier nobody runs on a PR from being a tier nobody runs at all (issue #159).
  # ---------------------------------------------------------------------------------------------
  ci-required:
    name: ci-required
    if: always()
    needs:
      - changes
      - lint-repo
      - lint-go
      - lint-web
      - lint-actions
      - lint-shell
      - security-licences
      - security-govulncheck
      - security-osv
      - typecheck
      - codegen-drift
      - spec-drift
      - test-unit
      - test-property
      - test-coverage-floor
      - test-golden
      - test-integration
      - test-migrations
      - test-authz
      - api-breaking
      - build-binary
      - build-image
      - test-e2e
      - bundle-budget
      - docs-build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          DEEP: ${{ needs.changes.outputs.deep }}
          POSTMERGE: ${{ needs.changes.outputs.postmerge }}
        run: |
          set -euo pipefail

          # 1. Nothing failed, cancelled, or errored. `skipped` is success by design.
          bad=$(jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | map(.key) | join(", ")' <<<"$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::ci-required: not green: ${bad}"
            exit 1
          fi

          # 2. Positive assertion — these jobs are unconditional and MUST have actually run.
          #    If one of them is "skipped", somebody added an `if:` that should not exist.
          missing=$(jq -rn --argjson r "$RESULTS" '
            ["changes","lint-repo","typecheck","codegen-drift","build-binary",
             "security-licences","security-govulncheck","security-osv"]
            | map(select($r[.].result != "success")) | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error::ci-required: always-on jobs did not run: ${missing}"
            echo "::error::A path filter or an if: condition is wrong. These jobs have no conditions."
            exit 1
          fi

          # 3. Positive assertion — on a ready PR or in the merge queue, the deep jobs must not
          #    have been silently skipped by a mis-scoped path filter.
          #
          #    EVERY job gated on `deep` must be named in this block. That is the invariant issue
          #    #82 broke from the other side — the gate held, but the event that clears it was not
          #    listened for — and TestCIRequired_DeepGatedJobs_AreAssertedNotSkipped keeps the two
          #    lists in step: a new `deep`-gated job that is not named below is a job whose skip is
          #    indistinguishable from a correct path filter.
          if [ "$DEEP" = "true" ]; then
            skipped=$(jq -rn --argjson r "$RESULTS" '
              ["test-e2e"]
              | map(select($r[.].result == "skipped")) | join(", ")')
            if [ -n "$skipped" ]; then
              echo "::error::ci-required: deep jobs were skipped on a non-draft run: ${skipped}"
              exit 1
            fi
          fi

          # 4. The same assertion for the post-merge tier (issue #159). `build / image` is skipped on
          #    every PR by design, which is exactly the shape #101 deleted two jobs for — a job that
          #    reports satisfied without running. The difference is that this one DOES run, on main
          #    and in a queue, and this is what proves it: on any run that is not a pull request it
          #    must not be in state "skipped".
          #
          #    EVERY job gated on `postmerge` must be named here, for the same reason as the deep
          #    list above, and TestCIRequired_PostMergeJobs_AreAssertedNotSkipped keeps the two in
          #    step.
          if [ "$POSTMERGE" = "true" ]; then
            skipped=$(jq -rn --argjson r "$RESULTS" '
              ["build-image"]
              | map(select($r[.].result == "skipped")) | join(", ")')
            if [ -n "$skipped" ]; then
              echo "::error::ci-required: post-merge jobs were skipped on a non-PR run: ${skipped}"
              exit 1
            fi
          fi

          echo "ci-required: green (deep=${DEEP} postmerge=${POSTMERGE})"
