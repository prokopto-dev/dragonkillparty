name: Setup toolchain
description: >
  Install and cache the Go and Node toolchains plus the pinned dev tools. Every input is optional so
  a job asks only for what it needs — a docs job should not pay for a Go install.

inputs:
  go:
    description: Install Go (version from go.mod once it exists, else the pinned default)
    required: false
    default: "false"
  node:
    description: Install Node and pnpm for the web build
    required: false
    default: "false"
  tools:
    description: >
      Space-separated dev tools to install: gofumpt golangci-lint sqlc atlas goose oasdiff vale
      lychee. An unknown or not-yet-available entry is reported and skipped, never fatal.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # go.mod does not exist until Phase 0 PR 1 lands the module, and setup-go fails hard when its
    # version file is missing. Detect first so pre-Phase-0 CI is green rather than red for a
    # reason no PR author can act on.
    - name: Detect go.mod
      id: gomod
      shell: bash
      run: |
        if [ -f go.mod ]; then echo "exists=true" >> "$GITHUB_OUTPUT"
        else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

    - name: Set up Go (from go.mod)
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Set up Go (pinned default, pre-Phase-0)
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'false'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.24"
        cache: false

    - name: Set up pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 9
        run_install: false

    - name: Set up Node
      if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    - name: Install dev tools
      if: inputs.tools != ''
      shell: bash
      env:
        DKP_TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        # Go-installed tools need a module to install from. Before Phase 0 PR 1 there is none, so
        # each is reported as skipped. The jobs that need them are themselves no-ops until then.
        for t in $DKP_TOOLS; do
          case "$t" in
            gofumpt|golangci-lint|sqlc|goose|oasdiff)
              if command -v go >/dev/null 2>&1 && [ -f go.mod ]; then
                echo "::group::install $t"
                case "$t" in
                  gofumpt)       go install mvdan.cc/gofumpt@latest ;;
                  golangci-lint) go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest ;;
                  sqlc)          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest ;;
                  goose)         go install github.com/pressly/goose/v3/cmd/goose@latest ;;
                  oasdiff)       go install github.com/oasdiff/oasdiff@latest ;;
                esac
                echo "::endgroup::"
              else
                echo "note: skipping $t — no Go module yet (lands in Phase 0 PR 1)"
              fi
              ;;
            atlas)  echo "note: skipping atlas — installed in Phase 0 PR 3" ;;
            vale)   echo "note: skipping vale — installed with the docs gates" ;;
            lychee) echo "note: skipping lychee — installed with the docs gates" ;;
            *)      echo "note: unknown tool '$t', skipped" ;;
          esac
        done
