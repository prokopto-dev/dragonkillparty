name: Setup toolchain
description: >
  Install and cache the Go and Node toolchains plus the pinned dev tools. Every input is optional so
  a job asks only for what it needs — a docs job should not pay for a Go install.

inputs:
  go:
    description: Install Go (version from go.mod once it exists, else the pinned default)
    required: false
    default: "false"
  node:
    description: Install Node and pnpm for the web build
    required: false
    default: "false"
  python:
    description: >
      Assert the runner's python3 clears CI's floor (3.10). Nothing is installed — every runner image
      this repository pins ships 3.12 — and that is exactly the point: before issue #83 the only
      record of it was a ci.yml comment saying "the runner has python3", so a base-image change would
      have surfaced as a GATE failing rather than as a missing dependency. Ask for this in any job
      that runs `make docs-links` or `make test`. Not `make verify-spec`: that gate was the one #83
      broke and it is Go since issue #127, which is why the spec-drift job no longer asks.
    required: false
    default: "false"
  tools:
    description: >
      Space-separated dev tools to install: gofumpt golangci-lint govulncheck sqlc atlas
      oasdiff vale lychee. An unknown or not-yet-available entry is reported and skipped, never
      fatal. `goose` is accepted and skipped: it is a library, not a CLI this project uses.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # go.mod does not exist until Phase 0 PR 1 lands the module, and setup-go fails hard when its
    # version file is missing. Detect first so pre-Phase-0 CI is green rather than red for a
    # reason no PR author can act on.
    - name: Detect go.mod
      id: gomod
      shell: bash
      run: |
        if [ -f go.mod ]; then echo "exists=true" >> "$GITHUB_OUTPUT"
        else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

    # `cache: false`, and the two blocks below are why (issue #157).
    #
    # setup-go's cache is not the module cache: its path list is hardcoded to BOTH `go env
    # GOMODCACHE` and `go env GOCACHE`, archived together under one key derived from go.sum. That key
    # is right for the modules and wrong for the build cache, so once #153 gave $GOCACHE a rolling
    # cache of its own, every Go job stored the build cache twice — once in the rolling entry that is
    # actually restored from, and once inside setup-go's go.sum-keyed archive, which nothing ever
    # reads back because that key does not roll forward. Measured cold, $GOCACHE here is ~240 MB, or
    # ~500 MB once -race objects are added: 100–200 MB compressed of duplicate upload, on every run
    # that changes go.sum, against the shared 10 GB limit whose pressure is what makes LRU evict the
    # entries that ARE being read.
    #
    # setup-go exposes no "modules only" switch — if one ever lands, the module-cache step below
    # collapses back into this `with:` block.
    - name: Set up Go (from go.mod)
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Set up Go (pinned default, pre-Phase-0)
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'false'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.24"
        cache: false

    # --- The two Go caches, separated (issues #153 and #157) -----------------------------------
    #
    # THERE ARE TWO CLASSES OF CACHE HERE AND THEY GET DIFFERENT WRITE POLICIES. The distinction is
    # the key, not the contents:
    #
    #   IMMUTABLE KEY ($GOMODCACHE below, the pnpm store further down). The key is a hash of a
    #   lockfile, so the entry a branch writes is re-read by that branch's every later push, and once
    #   `main` writes it every branch reads it through. Saving from a PR is therefore not waste, and
    #   this is what setup-go's `cache: true` did for the modules — the half of it issue #157 calls
    #   correct. These steps reproduce that behaviour and nothing else.
    #
    #   ROLLING KEY ($GOCACHE below, and ci.yml's Docker layer cache). The key ends in the commit
    #   sha, so a PR's write is hit by nothing, ever: the next push is a different sha. It burns
    #   quota against the shared 10 GB limit while evicting the entries that ARE shared. So: RESTORE
    #   EVERYWHERE, WRITE ON MAIN ONLY.
    #
    # Both live HERE rather than in ci.yml because every Go job in every workflow comes through this
    # action, so one block covers ci.yml, nightly-verify.yml, release.yml and edge.yml at once.
    - name: Locate the Go caches
      id: gocaches
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # `go env` rather than literal paths: they are GOOS-dependent, they honour a GOCACHE or
        # GOMODCACHE the runner image may already set, and a cache that archives the wrong directory
        # is a silent no-op rather than an error.
        printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        # The TOOLCHAIN that produced the objects (go1.24.6), not go.mod's language version: a
        # compiler bump invalidates every build-cache entry, so it belongs in that key rather than in
        # a stale archive nothing will ever hit again. The MODULE cache is deliberately not keyed on
        # it — module zips are source, identical across compilers, and a toolchain bump that
        # re-downloaded the whole graph would be a cost with nothing bought.
        printf 'toolchain=%s\n' "$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

    # $GOMODCACHE: the immutable half. go.sum is exactly the right key — the module cache's contents
    # change when and only when go.sum does — and the prefix restore-key means a dependency bump
    # restores the newest previous graph and downloads only what actually moved, rather than starting
    # cold.
    - name: Restore and save the Go module cache
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.gocaches.outputs.modules }}
        key: ${{ runner.os }}-${{ runner.arch }}-gomod-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gomod-

    # --- The Go build cache, rolled forward (issue #153) ---------------------------------------
    #
    # The build cache is invalidated by every source edit, so an immutable key is the wrong shape for
    # it twice over: it neither rolls forward nor updates once it exists. Under go.sum's hash — where
    # setup-go used to archive it — the entry restored on a PR is the one written the first time that
    # go.sum existed, so every package touched since recompiles, in every Go job, on every run.
    #
    # WRITE ON MAIN, READ EVERYWHERE — the same rule, for the same reason, as the Docker layer cache
    # in ci.yml's `build / image` job. A PR restores only (actions/cache/restore has no post step),
    # and main restores and saves (actions/cache's post step runs at job end, after the compilation
    # that filled the cache — saving from a step at the TOP of the job would archive last run's
    # objects).
    #
    # THE KEY ROLLS. `<os>-<arch>-gobuild-<toolchain>-<job>-<sha>` is unique per commit, so main
    # never hits it exactly and always writes a fresh entry, and restore-keys fall back by prefix to
    # the newest entry from the same job, then to the newest from any job. Issue #153 specifies the
    # two-segment `<os>-gobuild-<go-version>-<sha>`; the last restore-key IS that form, and the two
    # extra segments are a refinement it is worth being explicit about:
    #
    #   <arch>  ubuntu-24.04 and ubuntu-24.04-arm both report runner.os == 'Linux'. Go's cache is
    #           content-addressed and would MISS rather than mismatch, but mixing two
    #           architectures' objects in one entry doubles its size to buy nothing.
    #   <job>   `test / integration` builds -race objects that `test / unit` never produces, so a
    #           shared lane would hand the most expensive job the least useful cache. It also stops
    #           the several Go jobs of one main run racing to reserve a single key, where all but
    #           the first would log "cache already exists" and drop their work on the floor.
    #
    # A stale entry cannot make CI wrong, only slower: Go's cache is keyed by an action ID hashing
    # the compiler, the flags and every input, so a mismatched entry is a miss. What a WARM cache
    # can do is let `go test` report a false `(cached)` for a test whose real input is read by a
    # subprocess — which is why every `go test` recipe in the Makefile passes `-count=1`, and why
    # test/repo/gate_cache_test.go now holds that flag in place.
    #
    # Off main: restore, never save. Keep the key and restore-keys of the two steps IDENTICAL —
    # GitHub does not support YAML anchors in workflow or action files, so this is a copy, and
    # TestSetupToolchain_GoBuildCache_WritesOnMainReadsEverywhere is what stops the copies drifting.
    - name: Restore the Go build cache
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.gocaches.outputs.build }}
        key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.gocaches.outputs.toolchain }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.gocaches.outputs.toolchain }}-${{ github.job }}-
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.gocaches.outputs.toolchain }}-

    - name: Restore and save the Go build cache (main only)
      if: inputs.go == 'true' && steps.gomod.outputs.exists == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.gocaches.outputs.build }}
        key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.gocaches.outputs.toolchain }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.gocaches.outputs.toolchain }}-${{ github.job }}-
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.gocaches.outputs.toolchain }}-

    - name: Set up pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 9
        run_install: false

    # No `cache:` input here, deliberately, and the pnpm store is cached by the two steps below
    # instead. setup-node's built-in cache would archive the same store under its OWN key from its
    # OWN post step, which is issue #157's defect in the Node half: two archives of one directory,
    # one of which nothing restores from. One cache, one key, one place that says what it holds.
    - name: Set up Node
      if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"

    # --- The pnpm store ------------------------------------------------------------------------
    #
    # Nothing cached the pnpm store before this: every web job — `lint / web`, `typecheck`,
    # `gen / codegen-drift`, `security / licences`, `build / binary`, `test / e2e`, `budget / bundle`
    # — refetched the whole ~275-package graph from the registry on every run. The store is
    # content-addressed and `pnpm install --frozen-lockfile` is what every call site runs, so a warm
    # store turns an install into a link pass.
    #
    # IMMUTABLE KEY, so it saves from any branch (see the two-classes note above): the key is the
    # lockfile's hash, so a branch's write is re-read by its every later push and by every job of the
    # same run. `web/pnpm-lock.yaml` because web/ holds the only package.json in the repository —
    # test/repo/npmrc_test.go and osv_scanner_test.go both pin that path.
    - name: Locate the pnpm store
      id: pnpmstore
      if: inputs.node == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # `pnpm store path` rather than a literal ~/.local/share/pnpm/store: the location is
        # platform-dependent and settable from .npmrc, and archiving the wrong directory would be a
        # silent no-op. A failure here degrades to an uncached install rather than failing the job —
        # this is a cache, not a gate — but it says so out loud rather than looking like a cache hit
        # that never happened.
        dir="$(pnpm store path --silent 2>/dev/null || true)"
        if [ -z "$dir" ]; then
          echo "::warning::could not resolve the pnpm store path; this job installs uncached"
        fi
        printf 'dir=%s\n' "$dir" >> "$GITHUB_OUTPUT"

    - name: Restore and save the pnpm store
      if: inputs.node == 'true' && steps.pnpmstore.outputs.dir != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpmstore.outputs.dir }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpmstore-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpmstore-

    # CI's floor is 3.10, which is HIGHER than the 3.9 the scripts themselves require
    # (Makefile PYTHON_REQUIRED, and the guard at the top of each scripts/*.py). The two numbers say
    # different things and both are deliberate: 3.9 is what a contributor's stock interpreter must
    # manage — macOS ships 3.9.6 — and 3.10 is what CI is held to, so the pinned runner image's
    # Python is a checked fact rather than an accident of the base image.
    #
    # A newer CI interpreter cannot become a way to land syntax the floor rejects:
    # test/repo/python_floor_test.go re-parses every scripts/*.py at the 3.9 floor with
    # ast.parse(feature_version=...), and that test runs in `test / integration`.
    - name: Check python3
      if: inputs.python == 'true'
      shell: bash
      env:
        DKP_PYTHON_CI_FLOOR: "3.10"
      run: |
        set -euo pipefail
        command -v python3 >/dev/null 2>&1 || {
          echo "::error::python3 is not on PATH. make docs-links is Python, and test/repo re-parses" \
               "every scripts/*.py; without it a gate fails as if its subject were wrong (issue #83)."
          exit 1
        }
        have="$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
        # sort -V, so 3.9 sorts BELOW 3.10 — the comparison this check exists for is exactly the one
        # a lexicographic test gets backwards.
        if [ "$(printf '%s\n%s\n' "$DKP_PYTHON_CI_FLOOR" "$have" | sort -V | head -1)" != "$DKP_PYTHON_CI_FLOOR" ]; then
          echo "::error::python3 $have is below CI's floor of $DKP_PYTHON_CI_FLOOR." \
               "The runner image changed; pin an interpreter rather than letting a Python gate fail" \
               "as a content failure."
          exit 1
        fi
        printf '  python3 %s (CI floor %s; scripts/*.py themselves run on 3.9+)\n' "$have" "$DKP_PYTHON_CI_FLOOR"

    - name: Install dev tools
      if: inputs.tools != ''
      shell: bash
      env:
        DKP_TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        # Go-installed tools need a module to install from. Before Phase 0 PR 1 there is none, so
        # each is reported as skipped. The jobs that need them are themselves no-ops until then.
        #
        # Versions are read out of the Makefile rather than repeated here. A second copy of a pin is
        # a second thing to bump, and the failure mode is silent: CI and the laptop run different
        # linters and disagree about a green build. `make setup` and this action must install the
        # same binary or neither number means anything.
        pin() { awk -v k="$1" '$1==k { print $3; exit }' Makefile; }
        for t in $DKP_TOOLS; do
          case "$t" in
            gofumpt|golangci-lint|govulncheck|sqlc|oasdiff)
              if command -v go >/dev/null 2>&1 && [ -f go.mod ]; then
                echo "::group::install $t"
                case "$t" in
                  # The /v2/ path is load-bearing: the v1 module path still resolves and installs
                  # golangci-lint v1, which cannot read a `version: "2"` config. It would run,
                  # report a green lint job, and enforce none of the rules in .golangci.yml.
                  gofumpt)       go install "mvdan.cc/gofumpt@$(pin GOFUMPT_VERSION)" ;;
                  golangci-lint) go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$(pin GOLANGCI_LINT_VERSION)" ;;
                  # The command lives at cmd/govulncheck inside the golang.org/x/vuln module, which
                  # is what the GOVULNCHECK_VERSION pin tracks.
                  govulncheck)   go install "golang.org/x/vuln/cmd/govulncheck@$(pin GOVULNCHECK_VERSION)" ;;
                  sqlc)          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$(pin SQLC_VERSION)" ;;
                  # Not yet pinned because no job requests it; the PR that first needs it adds its
                  # pin to the Makefile alongside the others. See Phase 2.
                  oasdiff)       go install github.com/oasdiff/oasdiff@latest ;;
                esac
                echo "::endgroup::"
              else
                echo "note: skipping $t — no Go module yet (lands in Phase 0 PR 1)"
              fi
              ;;
            # Atlas cannot be `go install`ed: ariga.io/atlas/cmd/atlas carries a `replace` directive
            # in its own go.mod, which `go install <pkg>@<version>` refuses, and the newest version
            # ever published to the proxy for that path is v0.13.1 from 2023. It is a
            # checksum-verified binary instead.
            #
            # Through `make install-atlas` rather than calling the script directly, so that
            # GOTOOLS_BIN is computed in exactly one place. This action re-deriving an install
            # directory is how CI ends up installing to one path and putting a different one on
            # PATH.
            atlas)
              if command -v go >/dev/null 2>&1 && [ -f go.mod ]; then
                echo "::group::install atlas"
                make install-atlas
                echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
                echo "::endgroup::"
              else
                echo "note: skipping atlas — no Go module yet (lands in Phase 0 PR 1)"
              fi
              ;;
            # The goose CLI is deliberately absent. Atlas authors the migrations and the goose
            # LIBRARY applies them from inside the binary, so nothing ever invokes `goose` on PATH;
            # installing it would be a second copy of the migration engine to version and to drift.
            goose)  echo "note: skipping goose — the library is a go.mod dependency, the CLI is not used" ;;
            vale)   echo "note: skipping vale — installed with the docs gates" ;;
            lychee) echo "note: skipping lychee — installed with the docs gates" ;;
            *)      echo "note: unknown tool '$t', skipped" ;;
          esac
        done
