# sqlc — db/queries/*.sql becomes typed Go in internal/store/sqlitegen/.
#
# The schema sqlc type-checks against is the MIGRATION DIRECTORY, not db/schema.hcl: sqlc cannot
# read HCL, and pointing it at the migrations has the better property anyway — the types are
# derived from the DDL that will actually run on an officer's database, so a migration that says
# something different from the schema file produces a compile error rather than a runtime surprise.
#
# internal/store/sqlitegen/ is GENERATED. Never hand-edit it; change the query or the schema and
# run `make gen`.

version: "2"
sql:
  - engine: "sqlite"
    schema: "db/migrations-sqlite"
    queries: "db/queries"
    gen:
      go:
        package: "sqlitegen"
        out: "internal/store/sqlitegen"

        # database/sql, matching internal/store. The DBTX interface sqlc emits is deliberately the
        # same shape as store.DBTX, so store.Tx can hand its *sql.Tx straight to
        # sqlitegen.New(tx) without an adapter — see internal/store/tx.go.
        sql_package: "database/sql"

        # Interfaces, so internal/store can assert the generated Queries satisfies the shape the
        # rest of the codebase depends on, and so the Postgres port (post-1.0) has something to
        # implement rather than a second set of concrete types.
        emit_interface: true

        # A nullable column becomes *T rather than sql.NullT. setting it means the first nullable
        # column arrives as a pointer rather than silently changing every existing signature.
        emit_pointers_for_null_types: true

        # Type overrides. sqlc's SQLite engine (v1.31.1) types a nullable column read through a bare
        # `SELECT col` as `interface{}` rather than honouring emit_pointers_for_null_types — it loses
        # the affinity of a NULL column that is not projected through a join or an aggregate.
        # guild.inactive_after_days is the repo's first nullable column and the first to hit it.
        # account.person_id and account.system_key are PR 9's, and system_key is additionally a WHERE
        # parameter in GetSystemAccount, so without the override that method would take `interface{}`.
        # Pinning each to the pointer type emit_pointers_for_null_types would have produced keeps
        # `interface{}` out of the store contract and the domain signatures (.claude/rules/go-idioms.md
        # bans `any` in the middle of the typed boundaries).
        #
        # The aggregate/coalesce results (BalanceAsOfSeq, MaxPoolSeq, NextPoolSeq) are pinned in the
        # QUERY instead, with `CAST(... AS INTEGER)`: an override keys on `table.column` and an
        # aggregate result has no table, so the cast is the only lever that reaches it.
        overrides:
          - column: "guild.inactive_after_days"
            go_type:
              type: "int64"
              pointer: true
          - column: "account.person_id"
            go_type:
              type: "string"
              pointer: true
          - column: "account.system_key"
            go_type:
              type: "string"
              pointer: true
          # ledger_batch and ledger_entry (PR 9). sqlc's SQLite engine types every nullable column
          # read through a bare `SELECT col` as `interface{}` — the same affinity loss the block
          # above documents — so the ledger's two rows arrive riddled with `interface{}` fields
          # unless each nullable column is pinned to the type emit_pointers_for_null_types would have
          # produced. The BLOB columns are pinned to []byte (a hash is bytes, not a string); every
          # other nullable column here is a *string or *int64.
          - column: "ledger_batch.rng_seed"
            go_type:
              type: "int64"
              pointer: true
          - column: "ledger_batch.source_ref"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_batch.actor_user_id"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_batch.actor_token_id"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_batch.reverses_batch_id"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_batch.idempotency_key"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_batch.prev_hash"
            go_type:
              type: "byte"
              slice: true
          - column: "ledger_entry.character_id"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_entry.item_id"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_entry.item_award_id"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_entry.raid_id"
            go_type:
              type: "string"
              pointer: true
          - column: "ledger_entry.tick_id"
            go_type:
              type: "string"
              pointer: true
          # audit_log (PR 10a). Same affinity loss as every block above: without these three the
          # generated InsertAuditLogParams would carry `interface{}` for the two nullable TEXT
          # columns and the nullable BLOB, and `any` in a domain signature is what
          # .claude/rules/go-idioms.md bans. resource_id is NULL for an instance-wide action;
          # ledger_batch_id is NULL for an audit row that moved no points (a role grant, a settings
          # change); prev_hash is NULL only at seq = 1, where the chain has no predecessor.
          #
          # event_outbox needs no override: every one of its columns is NOT NULL, and event_seq is
          # read back through RETURNING rather than projected out of a nullable expression.
          - column: "audit_log.resource_id"
            go_type:
              type: "string"
              pointer: true
          - column: "audit_log.ledger_batch_id"
            go_type:
              type: "string"
              pointer: true
          - column: "audit_log.prev_hash"
            go_type:
              type: "byte"
              slice: true
          # pool_config_change and decay_run (Phase 1, #191/#192). Same affinity loss again, and the
          # first table to hit it with a nullable INTEGER as well as nullable TEXT: without these
          # five, `make gen` writes `interface{}` into the two generated row structs. Each is pinned
          # to what emit_pointers_for_null_types would have produced.
          #
          # changed_by and triggered_by are DEFERRED FKs — app_user is a Phase 2 table — so they are
          # nullable TEXT with no constraint today and stay *string when the FK lands. executed_at is
          # NULL until a run reaches a terminal state, which is a fact about the row rather than a
          # zero Micros; ledger_batch_id and migration_batch_id are NULL for a run or a config change
          # that posted no batch.
          - column: "pool_config_change.changed_by"
            go_type:
              type: "string"
              pointer: true
          - column: "pool_config_change.migration_batch_id"
            go_type:
              type: "string"
              pointer: true
          - column: "decay_run.executed_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "decay_run.ledger_batch_id"
            go_type:
              type: "string"
              pointer: true
          - column: "decay_run.triggered_by"
            go_type:
              type: "string"
              pointer: true
          # The authz tables (Phase 2 Wave 0b, #261). Same affinity loss as every block above: sqlc's
          # SQLite engine types a nullable column read through a bare `SELECT col` as `interface{}`,
          # and `any` in the middle of the typed boundaries is what .claude/rules/go-idioms.md bans.
          # Each is pinned to what emit_pointers_for_null_types would have produced.
          #
          # permission.orphaned_at is NULL for a live key and a Micros timestamp for one the running
          # binary no longer ships (internal/authz.Reconcile never deletes a row). role.key is NULL for
          # a guild's own role and non-NULL for a built-in. role_assignment's four are the scope target
          # (NULL exactly when the scope is global), a suspension that is usually absent, the DEFERRED
          # FK to app_user, and an expiry that is usually never.
          - column: "permission.orphaned_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "role.key"
            go_type:
              type: "string"
              pointer: true
          - column: "role.deleted_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "role_assignment.scope_id"
            go_type:
              type: "string"
              pointer: true
          - column: "role_assignment.suspended_until_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "role_assignment.granted_by"
            go_type:
              type: "string"
              pointer: true
          - column: "role_assignment.expires_at"
            go_type:
              type: "int64"
              pointer: true
          # The auth tables (Phase 2 Wave 0d, #273). Same affinity loss as every block above, on the
          # widest set yet: six tables whose whole purpose is optional facts. Each is pinned to what
          # emit_pointers_for_null_types would have produced, and the three encrypted BLOBs to
          # []byte, because a ciphertext is bytes and a *string over one invites a UTF-8 assumption
          # that holds until the day it does not.
          #
          # NULL IS A DIFFERENT FACT PER COLUMN HERE, which is why none of them collapses to a zero
          # value: app_user.email NULL is "this guild has no mail server" (SMTP is optional);
          # deleted_at NULL is "not deleted", and the two unique indexes are partial over exactly
          # that; user_identity.password_hash NULL is "this identity cannot authenticate with a
          # password", which is what the EQdkp importer writes because legacy hashes are never
          # migrated; api_token.expires_at NULL is the deliberate never-expires token that carries a
          # permanent warning badge; revoked_at NULL is the one the middleware requires.
          - column: "app_user.email"
            go_type:
              type: "string"
              pointer: true
          - column: "app_user.email_norm"
            go_type:
              type: "string"
              pointer: true
          - column: "app_user.email_verified_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "app_user.timezone"
            go_type:
              type: "string"
              pointer: true
          - column: "app_user.locale"
            go_type:
              type: "string"
              pointer: true
          - column: "app_user.last_login_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "app_user.locked_until_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "app_user.mfa_totp_secret_enc"
            go_type:
              type: "byte"
              slice: true
          - column: "app_user.mfa_enrolled_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "app_user.deleted_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "user_identity.password_hash"
            go_type:
              type: "string"
              pointer: true
          - column: "user_identity.password_algo"
            go_type:
              type: "string"
              pointer: true
          - column: "user_identity.password_set_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "user_identity.access_token_enc"
            go_type:
              type: "byte"
              slice: true
          - column: "user_identity.refresh_token_enc"
            go_type:
              type: "byte"
              slice: true
          - column: "user_identity.token_expires_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "user_identity.last_used_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "session.identity_id"
            go_type:
              type: "string"
              pointer: true
          - column: "session.revoked_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "session.mfa_satisfied_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "api_token.expires_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "api_token.last_used_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "api_token.revoked_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "api_token.revoked_by"
            go_type:
              type: "string"
              pointer: true
          - column: "feed_token.revoked_at"
            go_type:
              type: "int64"
              pointer: true
          - column: "feed_token.last_used_at"
            go_type:
              type: "int64"
              pointer: true
