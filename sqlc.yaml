# sqlc — db/queries/*.sql becomes typed Go in internal/store/sqlitegen/.
#
# The schema sqlc type-checks against is the MIGRATION DIRECTORY, not db/schema.hcl: sqlc cannot
# read HCL, and pointing it at the migrations has the better property anyway — the types are
# derived from the DDL that will actually run on an officer's database, so a migration that says
# something different from the schema file produces a compile error rather than a runtime surprise.
#
# internal/store/sqlitegen/ is GENERATED. Never hand-edit it; change the query or the schema and
# run `make gen`.

version: "2"
sql:
  - engine: "sqlite"
    schema: "db/migrations-sqlite"
    queries: "db/queries"
    gen:
      go:
        package: "sqlitegen"
        out: "internal/store/sqlitegen"

        # database/sql, matching internal/store. The DBTX interface sqlc emits is deliberately the
        # same shape as store.DBTX, so store.Tx can hand its *sql.Tx straight to
        # sqlitegen.New(tx) without an adapter — see internal/store/tx.go.
        sql_package: "database/sql"

        # Interfaces, so internal/store can assert the generated Queries satisfies the shape the
        # rest of the codebase depends on, and so the Postgres port (post-1.0) has something to
        # implement rather than a second set of concrete types.
        emit_interface: true

        # A nullable column becomes *T rather than sql.NullT. setting it means the first nullable
        # column arrives as a pointer rather than silently changing every existing signature.
        emit_pointers_for_null_types: true

        # Type overrides. sqlc's SQLite engine (v1.31.1) types a nullable column read through a bare
        # `SELECT col` as `interface{}` rather than honouring emit_pointers_for_null_types — it loses
        # the affinity of a NULL column that is not projected through a join or an aggregate.
        # guild.inactive_after_days is the repo's first nullable column and the first to hit it.
        # account.person_id and account.system_key are PR 9's, and system_key is additionally a WHERE
        # parameter in GetSystemAccount, so without the override that method would take `interface{}`.
        # Pinning each to the pointer type emit_pointers_for_null_types would have produced keeps
        # `interface{}` out of the store contract and the domain signatures (.claude/rules/go-idioms.md
        # bans `any` in the middle of the typed boundaries).
        #
        # The aggregate/coalesce results (BalanceAsOfSeq, MaxPoolSeq, NextPoolSeq) are pinned in the
        # QUERY instead, with `CAST(... AS INTEGER)`: an override keys on `table.column` and an
        # aggregate result has no table, so the cast is the only lever that reaches it.
        overrides:
          - column: "guild.inactive_after_days"
            go_type:
              type: "int64"
              pointer: true
          - column: "account.person_id"
            go_type:
              type: "string"
              pointer: true
          - column: "account.system_key"
            go_type:
              type: "string"
              pointer: true
